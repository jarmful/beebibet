<script>

/* ============================================================
   Tähetaevas (canvas)
   ============================================================ */
(function starfield() {
  const cv = document.getElementById("stars");
  const cx = cv.getContext("2d");
  let stars = [];
  function resize() {
    cv.width = innerWidth; cv.height = innerHeight;
    stars = Array.from({ length: 130 }, () => ({
      x: Math.random() * cv.width, y: Math.random() * cv.height,
      r: Math.random() * 1.4 + .3, s: Math.random() * .25 + .05,
      p: Math.random() * Math.PI * 2, tw: Math.random() * 1.5 + .5
    }));
  }
  resize(); addEventListener("resize", resize);
  (function loop(t) {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (const st of stars) {
      st.y += st.s; if (st.y > cv.height) { st.y = -2; st.x = Math.random() * cv.width; }
      const a = .35 + .55 * Math.abs(Math.sin(t / 1000 * st.tw + st.p));
      cx.globalAlpha = a; cx.fillStyle = "#cfe4ff";
      cx.beginPath(); cx.arc(st.x, st.y, st.r, 0, 7); cx.fill();
    }
    requestAnimationFrame(loop);
  })(0);
})();

/* ============================================================
   Helimootor (Web Audio, failideta)
   ============================================================ */
const AudioEngine = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let musicOn = localStorage.getItem("kosmos_music") !== "0";
  let sfxOn = localStorage.getItem("kosmos_sfx") !== "0";
  let musicStarted = false, bassTimer = null;

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = musicOn ? .3 : 0; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = sfxOn ? .75 : 0; sfxBus.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }

  // Ambientne kosmosepadi: 3 kergelt häälest väljas ostsillaatorit
  // läbi madalpääsfiltri, mille lõikesagedust liigutab aeglane LFO.
  function startMusic() {
    if (musicStarted || !ensure()) return;
    musicStarted = true;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass"; filter.frequency.value = 420; filter.Q.value = 1.2;
    const padGain = ctx.createGain(); padGain.gain.value = 0;
    padGain.gain.linearRampToValueAtTime(.16, ctx.currentTime + 4);
    filter.connect(padGain); padGain.connect(musicBus);

    [[110, -7, "sawtooth"], [110, 7, "sawtooth"], [165, 3, "triangle"]].forEach(([f, det, type]) => {
      const o = ctx.createOscillator();
      o.type = type; o.frequency.value = f; o.detune.value = det;
      o.connect(filter); o.start();
    });
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.frequency.value = .045; lfoG.gain.value = 260;
    lfo.connect(lfoG); lfoG.connect(filter.frequency); lfo.start();
    const lfo2 = ctx.createOscillator(), lfo2G = ctx.createGain();
    lfo2.frequency.value = .11; lfo2G.gain.value = .05;
    lfo2.connect(lfo2G); lfo2G.connect(padGain.gain); lfo2.start();

    // Hõre sügav bassipulss
    bassTimer = setInterval(() => {
      if (!musicOn) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(55, t);
      o.frequency.exponentialRampToValueAtTime(41, t + 1.4);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.5, t + .05);
      g.gain.exponentialRampToValueAtTime(.001, t + 1.6);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 1.7);
    }, 3400);
  }

  function tone(freq, dur, opts) {
    if (!ctx) return;
    opts = opts || {};
    const t = ctx.currentTime + (opts.delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = opts.type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(opts.vol != null ? opts.vol : .25, t + .012);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + dur + .05);
  }

  function playSfx(name, param) {
    if (!sfxOn || !ensure()) return;
    switch (name) {
      case "spin":
        tone(140, .4, { type: "sawtooth", slide: 880, vol: .14 });
        tone(70, .4, { type: "sine", slide: 440, vol: .12 });
        break;
      case "tick":
        tone(820 + Math.random() * 380, .05, { type: "square", vol: .05 });
        break;
      case "win": {
        const lvl = Math.min(param || 0, 6);
        const base = 300 * Math.pow(1.16, lvl);
        const scale = [0, 3, 5, 7, 10, 12, 15];
        for (let i = 0; i < 4 + lvl; i++)
          tone(base * Math.pow(2, scale[i % 7] / 12 + Math.floor(i / 7)), .16, { type: "triangle", vol: .2, delay: i * .07 });
        break;
      }
      case "mult":
        tone(1320, .3, { type: "sine", vol: .22 });
        tone(1980, .34, { type: "sine", vol: .14, delay: .04 });
        tone(2640, .3, { type: "sine", vol: .08, delay: .08 });
        break;
      case "scatter":
        tone(150, .7, { type: "sine", slide: 38, vol: .5 });
        tone(90, .5, { type: "triangle", slide: 30, vol: .3, delay: .05 });
        break;
      case "bonus":
        [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) =>
          tone(f, .22, { type: "triangle", vol: .26, delay: i * .13 }));
        tone(262, 1.2, { type: "sawtooth", vol: .1, delay: .9 });
        break;
      case "bigwin":
        [392, 523, 659, 784, 659, 784, 1047, 1319, 1568].forEach((f, i) => {
          tone(f, .3, { type: "triangle", vol: .24, delay: i * .12 });
          tone(f / 2, .3, { type: "sine", vol: .12, delay: i * .12 });
        });
        break;
      case "click":
        tone(520, .06, { type: "sine", vol: .12 });
        break;
    }
  }

  function setMusic(on) {
    musicOn = on; localStorage.setItem("kosmos_music", on ? "1" : "0");
    if (ensure()) {
      if (on && !musicStarted) startMusic();
      if (musicBus) musicBus.gain.linearRampToValueAtTime(on ? .3 : 0, ctx.currentTime + .3);
    }
  }
  function setSfx(on) {
    sfxOn = on; localStorage.setItem("kosmos_sfx", on ? "1" : "0");
    if (ctx && sfxBus) sfxBus.gain.value = on ? .75 : 0;
  }
  function userStart() { if (ensure() && musicOn) startMusic(); }

  return { playSfx, setMusic, setSfx, userStart, get musicOn() { return musicOn; }, get sfxOn() { return sfxOn; } };
})();
addEventListener("pointerdown", () => AudioEngine.userStart(), { passive: true });

  const [ringMults, setRingMults] = useState({});  // cell -> 0 (märk) | 2..128
  const [particles, setParticles] = useState([]);
  const [fs, setFs] = useState(null);              // {remaining, total, win}
  const [overlay, setOverlay] = useState(null);    // {kind, ...}
  const [toast, setToast] = useState(null);
  const [boardOpen, setBoardOpen] = useState(false);
  const [boardRows, setBoardRows] = useState(null);
  const [boardErr, setBoardErr] = useState(null);
  const [nameVal, setNameVal] = useState(() => localStorage.getItem("kosmos_name") || "");

  const rngRef = useRef(M.makeRng(M.randomSeed()));
  const turboRef = useRef(turbo); turboRef.current = turbo;
  const balanceRef = useRef(balance); balanceRef.current = balance;
  const spinningRef = useRef(false);
  const overlayResolve = useRef(null);
  const winCounterRef = useRef(null);

  // Rahulik avavaade: juhuslik ruudustik enne esimest keerutust
  useEffect(() => {
    setTiles(buildTiles(M.generateGrid(rngRef.current, false, 0), true));
    const t = setTimeout(() => setTiles(ts => ts.map(x => ({ ...x, y: x.row }))), 40);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => { localStorage.setItem("kosmos_balance", String(balance)); }, [balance]);
  useEffect(() => { localStorage.setItem("kosmos_betidx", String(betIdx)); }, [betIdx]);
  useEffect(() => { localStorage.setItem("kosmos_turbo", turbo ? "1" : "0"); }, [turbo]);

  const T = ms => Math.round(ms / (turboRef.current ? 3 : 1));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- abifunktsioonid ---------- */

  function showToast(msg, dur) {
    setToast(msg);
    setTimeout(() => setToast(t => (t === msg ? null : t)), dur || 1800);
  }

  // Ootab kuni kasutaja sulgeb ülekatte (nupp kutsub resolveOverlay)
  function waitOverlay(o) {
    return new Promise(res => { overlayResolve.current = res; setOverlay(o); });
  }
  function resolveOverlay() {
    setOverlay(null);
    if (overlayResolve.current) { const r = overlayResolve.current; overlayResolve.current = null; r(); }
  }
  // Ajapiiranguga ülekate (suured võidud) — sulgub ise, puudutus kiirendab
  async function timedOverlay(o, ms) {
    let done = false;
    await Promise.race([
      waitOverlay(o),
      sleep(ms).then(() => { if (!done) resolveOverlay(); })
    ]);
    done = true;
  }

  function countUpWin(from, to, dur) {
    clearInterval(winCounterRef.current);
    const steps = Math.max(1, Math.round(dur / 40));
    let i = 0;
    winCounterRef.current = setInterval(() => {
      i++;
      const v = from + (to - from) * (i / steps);
      setWinDisplay(v);
      if (i >= steps) clearInterval(winCounterRef.current);
    }, 40);
  }

  /* ---------- ruudustiku animatsioonid ---------- */

  function buildTiles(grid, dropIn) {
    const arr = [];
    for (let c = 0; c < M.CELLS; c++) {
      const row = (c / 7) | 0, col = c % 7;
      arr.push({
        id: tileSeq++, sym: grid[c], col, row,
        y: dropIn ? row - 9 : row, phase: "idle",
        delay: dropIn ? col * 45 : 0
      });
    }
    return arr;
  }

  async function animateDrop(grid) {
    setTiles(buildTiles(grid, true));
    await sleep(30);
    setTiles(ts => ts.map(t => ({ ...t, y: t.row })));
    for (let i = 0; i < 4; i++) { setTimeout(() => AudioEngine.playSfx("tick"), T(120) * (i + 1)); }
    await sleep(T(420) + 7 * 45 / (turboRef.current ? 3 : 1));
  }

  function spawnParticles(cells, color) {
    const ps = [];
    for (const c of cells) {
      const row = (c / 7) | 0, col = c % 7;
      for (let i = 0; i < 5; i++) {
        const ang = Math.random() * Math.PI * 2, dist = 26 + Math.random() * 46;
        ps.push({
          id: tileSeq++, x: (col + .5) * CELL, y: (row + .5) * CELL,
          dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist, color
        });
      }
    }
    setParticles(p => [...p, ...ps]);
    setTimeout(() => setParticles(p => p.filter(x => !ps.includes(x))), 650);
  }

  // Mängib ühe keerutuse tulemuse sammhaaval maha
  async function animateSpin(result, bet, ringsPersist, winSoFar) {
    if (!ringsPersist) setRingMults({});
    await animateDrop(result.initialGrid);
    if (result.scatterCount > 0) AudioEngine.playSfx("scatter");

    let acc = winSoFar || 0;
    // tileGrid: lahter -> tile (jälgime positsioone tumble'ide vahel)
    let tileGrid = null;
    setTiles(ts => { tileGrid = ts.slice().sort((a, b) => (a.row * 7 + a.col) - (b.row * 7 + b.col)); return ts; });
    await sleep(20);

    for (const step of result.steps) {
      const winCells = new Set();
      let maxLvl = 0;
      const upgrades = [];
      const newMarks = [];
      for (const cl of step.clusters) {
        cl.cells.forEach(c => winCells.add(c));
        maxLvl = Math.max(maxLvl, Math.floor(Math.log2(cl.pay / bet + 1)));
        upgrades.push(...cl.upgrades);
        newMarks.push(...cl.newMarks);
      }

      // 1) võiduklastrite pulseerimine
      setTiles(ts => ts.map(t => winCells.has(t.row * 7 + t.col) && t.phase === "idle" ? { ...t, phase: "win" } : t));
      AudioEngine.playSfx("win", maxLvl);
      countUpWin(acc, acc + step.stepWin, T(550));
      acc += step.stepWin;

      // 2) kordajate uuendused + uued märgid
      if (upgrades.length) setTimeout(() => AudioEngine.playSfx("mult"), T(220));
      setRingMults(rm => {
        const next = { ...rm };
        for (const u of upgrades) next[u.cell] = u.to;
        for (const c of newMarks) if (next[c] == null) next[c] = 0;
        return next;
      });
      await sleep(T(620));

      // 3) lahustumine osakesteks
      const colors = step.clusters.map(cl => M.SYMBOLS[cl.sym].color);
      step.clusters.forEach((cl, i) => spawnParticles(cl.cells, colors[i]));
      setTiles(ts => ts.map(t => winCells.has(t.row * 7 + t.col) ? { ...t, phase: "die" } : t));
      await sleep(T(330));

      // 4) tumble: ellujäänud kukuvad, uued tulevad ülevalt
      const survivors = [];
      const newTiles = [];
      for (let col = 0; col < 7; col++) {
        let write = 6;
        for (let row = 6; row >= 0; row--) {
          const c = row * 7 + col;
          if (!step.removed[c]) {
            const t = tileGrid[c];
            survivors.push({ ...t, row: write, y: write, phase: "idle", delay: 0 });
            write--;
          }
        }
        const removedCount = write + 1;
        for (let row = removedCount - 1; row >= 0; row--) {
          newTiles.push({
            id: tileSeq++, sym: step.gridAfter[row * 7 + col], col, row,
            y: row - removedCount - 1, phase: "idle", delay: 0
          });
        }
      }
      const all = [...survivors, ...newTiles];
      setTiles(all);
      await sleep(30);
      setTiles(ts => ts.map(t => ({ ...t, y: t.row })));
      AudioEngine.playSfx("tick");
      await sleep(T(400));

      tileGrid = new Array(M.CELLS);
      for (const t of all) tileGrid[t.row * 7 + t.col] = { ...t, y: t.row };
    }
    return acc;
  }

  /* ---------- suured võidud & edetabel ---------- */

  async function celebrate(win, bet, capped) {
    const x = win / bet;
    if (capped || x >= 5000) {
      AudioEngine.playSfx("bigwin");
      await timedOverlay({ kind: "bigwin", title: "MAX VÕIT!", cls: "cosmic", amt: win, ico: "👑" }, 4200);
    } else if (x >= 500) {
      AudioEngine.playSfx("bigwin");
      await timedOverlay({ kind: "bigwin", title: "KOSMILINE VÕIT!", cls: "cosmic", amt: win, ico: "🌌" }, 3600);
    } else if (x >= 100) {
      AudioEngine.playSfx("bigwin");
      await timedOverlay({ kind: "bigwin", title: "MEGAVÕIT!", cls: "", amt: win, ico: "💫" }, 3000);
    } else if (x >= 20) {
      AudioEngine.playSfx("bigwin");
      await timedOverlay({ kind: "bigwin", title: "Kena võit!", cls: "", amt: win, ico: "🌟" }, 2400);
    }
  }

  async function maybeSubmitScore(win, bet) {
    if (!sb || win < 50 * bet) return;
    await waitOverlay({ kind: "name", amt: win, mult: win / bet });
  }

  async function submitScore(win, mult) {
    const name = nameVal.trim();
    if (!name) return;
    localStorage.setItem("kosmos_name", name);
    try {
      await sb.from("kosmos_leaderboard").insert({
        name, win_amount: +win.toFixed(2), win_multiplier: +mult.toFixed(2)
      });
    } catch (err) { console.error(err); }
  }

  async function loadBoard() {
    setBoardErr(null); setBoardRows(null);
    const { data, error } = await sb.from("kosmos_leaderboard")
      .select("name,win_amount,win_multiplier")
      .order("win_multiplier", { ascending: false })
      .limit(10);
    if (error) { setBoardErr(error.message + " (" + error.code + ")"); return; }
    setBoardRows(data || []);
  }
  useEffect(() => { if (boardOpen && sb) loadBoard(); }, [boardOpen]);

  /* ---------- keerutus ---------- */

  async function doSpin(buy) {
    if (spinningRef.current) return;
    const bet = BETS[betIdx];
    const cost = buy ? 100 * bet : bet;
    if (balanceRef.current < cost - 1e-9) { setOverlay({ kind: "refuel" }); return; }

    spinningRef.current = true; setSpinning(true);
    setBalance(b => +(b - cost).toFixed(2));
    setLastWin(0); setWinDisplay(0);
    AudioEngine.playSfx("spin");

    const rng = rngRef.current;
    const cap = M.MAX_WIN_X * bet;
    const marks = M.freshMarks(), mults = M.freshMults();
    const forced = buy ? M.drawBuyScatters(rng) : 0;
    const result = M.playSpin(rng, bet, marks, mults, true, forced, cap);

    await animateSpin(result, bet, false, 0);
    let roundWin = result.win;

    if (!result.capped && result.scatterCount >= 3) {
      roundWin = await runBonus(result.scatterCount, bet, result.win, rng);
    } else {
      setBalance(b => +(b + result.win).toFixed(2));
      setLastWin(result.win); setWinDisplay(result.win);
      await celebrate(result.win, bet, result.capped);
    }

    if (roundWin > 0) setSessionBest(s => Math.max(s, roundWin));
    await maybeSubmitScore(roundWin, bet);

    spinningRef.current = false; setSpinning(false);
    if (balanceRef.current < BETS[0] - 1e-9) setOverlay({ kind: "refuel" });
  }

  async function runBonus(scatters, bet, baseWin, rng) {
    AudioEngine.playSfx("bonus");
    const startSpins = M.spinsForScatters(scatters);
    await waitOverlay({ kind: "bonusIntro", spins: startSpins, scatters });

    const cap = M.MAX_WIN_X * bet;
    const fsMarks = M.freshMarks(), fsMults = M.freshMults();
    let remaining = startSpins, total = baseWin, fsWin = 0, capped = false;
    setFs({ remaining, total: startSpins, win: 0 });

    while (remaining > 0 && total < cap) {
      remaining--;
      setFs({ remaining, win: fsWin });
      AudioEngine.playSfx("spin");
      const r = M.playSpin(rng, bet, fsMarks, fsMults, true, 0, cap - total);
      await animateSpin(r, bet, true, fsWin);
      fsWin += r.win; total += r.win;
      setFs({ remaining, win: fsWin });
      setWinDisplay(fsWin);
      if (r.capped) { capped = true; break; }
      if (r.scatterCount >= 3) {
        const extra = M.spinsForScatters(r.scatterCount);
        remaining += extra;
        AudioEngine.playSfx("bonus");
        showToast("🕳️ +" + extra + " keerutust!");
        setFs({ remaining, win: fsWin });
        await sleep(T(900));
      }
      await sleep(T(280));
    }

    setFs(null);
    setRingMults({});
    setBalance(b => +(b + total).toFixed(2));
    setLastWin(total); setWinDisplay(total);
    AudioEngine.playSfx("bigwin");
    await waitOverlay({ kind: "bonusEnd", amt: total, capped });
    await celebrate(total, bet, capped);
    return total;
  }

  function refuel() {
    AudioEngine.playSfx("click");
    setBalance(100); setSessionBest(0); setLastWin(0); setWinDisplay(0);
    setOverlay(null);
  }

  /* ---------- render ---------- */

  const bet = BETS[betIdx];
  const buyCost = 100 * bet;
  const buyAllowed = betIdx <= MAX_BUY_BET_IDX;
  const dropSecs = (turbo ? .13 : .38);

  const cellBgs = [];
  for (let c = 0; c < M.CELLS; c++) {
    cellBgs.push(e("div", {
      key: "bg" + c, className: "cellbg",
      style: { left: (c % 7) * CELL + "%", top: ((c / 7) | 0) * CELL + "%" }
    }));
  }

  const rings = Object.entries(ringMults).map(([cell, val]) => {
    const c = +cell;
    return e("div", {
      key: "r" + c + "-" + val,
      className: "ring" + (val > 0 ? " hasMult pop" : ""),
      style: { left: (c % 7) * CELL + "%", top: ((c / 7) | 0) * CELL + "%" }
    }, val > 0 ? e("span", { className: "mval" }, "×" + val) : null);
  });

  const tileEls = tiles.map(t => e("div", {
    key: t.id,
    className: "tile" + (t.phase === "win" ? " win" : t.phase === "die" ? " die" : "") + (t.sym === M.SCATTER ? " scat" : ""),
    style: {
      left: t.col * CELL + "%", top: t.y * CELL + "%",
      transitionDuration: dropSecs + "s", transitionDelay: (t.delay || 0) + "ms"
    }
  }, M.SYMBOLS[t.sym].emoji));

  const particleEls = particles.map(p => e("div", {
    key: p.id, className: "particle",
    style: { left: p.x + "%", top: p.y + "%", background: p.color, "--dx": p.dx + "px", "--dy": p.dy + "px", boxShadow: "0 0 6px " + p.color }
  }));

  let ovl = null;
  if (overlay) {
    if (overlay.kind === "bonusIntro") {
      ovl = e("div", { className: "ovl" },
        e("div", { className: "bigico" }, "🕳️"),
        e("h2", { style: { color: "var(--magenta)" } }, "TASUTA KEERUTUSED!"),
        e("p", { style: { fontSize: 15 } }, overlay.scatters + " Musta Auku = ", e("b", { style: { color: "var(--gold)" } }, overlay.spins + " tasuta keerutust")),
        e("p", { style: { fontSize: 12, color: "var(--inkSoft)", lineHeight: 1.5 } }, "Kordajad ja märgid püsivad kõigi tasuta keerutuste vältel!"),
        e("button", { className: "neonbtn gold", onClick: () => { AudioEngine.playSfx("click"); resolveOverlay(); } }, "Alusta 🚀"));
    } else if (overlay.kind === "bonusEnd") {
      ovl = e("div", { className: "ovl" },
        e("div", { className: "bigico" }, overlay.capped ? "👑" : "🏆"),
        e("h2", null, "Boonus läbi!"),
        e("div", { className: "winAmt" }, fmt(overlay.amt)),
        e("p", { style: { fontSize: 13, color: "var(--inkSoft)" } }, fmtX(overlay.amt / bet) + " panusest"),
        e("button", { className: "neonbtn", onClick: () => { AudioEngine.playSfx("click"); resolveOverlay(); } }, "Jätka"));
    } else if (overlay.kind === "bigwin") {
      ovl = e("div", { className: "ovl", onClick: resolveOverlay },
        e("div", { className: "bigico" }, overlay.ico),
        e("div", { className: "winTitle " + overlay.cls }, overlay.title),
        e("div", { className: "winAmt" }, fmt(overlay.amt)));
    } else if (overlay.kind === "refuel") {
      ovl = e("div", { className: "ovl" },
        e("div", { className: "bigico" }, "🛢️"),
        e("h2", null, "Kütus otsas!"),
        e("p", { style: { fontSize: 13, color: "var(--inkSoft)", lineHeight: 1.6 } }, "Sinu mänguraha on otsas.", e("br"), "Tangi paak uuesti täis — see on ju mängu­raha!"),
        e("button", { className: "neonbtn gold", onClick: refuel }, "Tangi 100.00 ⛽"));
    } else if (overlay.kind === "name") {
      ovl = e("div", { className: "ovl" },
        e("div", { className: "bigico" }, "🏆"),
        e("h2", null, "Suur võit — " + fmtX(overlay.mult) + "!"),
        e("p", { style: { fontSize: 13, color: "var(--inkSoft)" } }, "Kirjuta oma nimi edetabelisse:"),
        e("input", {
          className: "name-input", maxLength: 20, placeholder: "Sinu nimi",
          value: nameVal, onChange: ev => setNameVal(ev.target.value)
        }),
        e("button", {
          className: "neonbtn gold",
          onClick: async () => { AudioEngine.playSfx("click"); await submitScore(overlay.amt, overlay.mult); resolveOverlay(); }
        }, "Salvesta edetabelisse 🏆"),
        e("button", { className: "neonbtn ghost", onClick: resolveOverlay }, "Jäta vahele"));
    }
  }

  const boardOvl = boardOpen ? e("div", { className: "ovl", onClick: ev => { if (ev.target === ev.currentTarget) setBoardOpen(false); } },
    e("div", { className: "panel" },
      e("h2", { style: { marginBottom: 14 } }, "🏆 Edetabel"),
      boardErr ? e("div", { className: "db-error" }, "Laadimine ebaõnnestus: " + boardErr) :
        boardRows == null ? e("div", { className: "board-empty" }, "Laen…") :
          boardRows.length === 0 ? e("div", { className: "board-empty" }, "Ole esimene edetabelis! Võida 50x panus.") :
            boardRows.map((r, i) => e("div", { className: "board-row", key: i },
              e("span", { className: "board-rank" }, i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1) + "."),
              e("span", { className: "board-name" }, r.name),
              e("span", { className: "board-mult" }, fmtX(+r.win_multiplier)),
              e("span", { className: "board-amt" }, fmt(+r.win_amount)))),
      e("div", { style: { textAlign: "center", marginTop: 14 } },
        e("button", { className: "neonbtn ghost", onClick: () => setBoardOpen(false) }, "Sulge")))) : null;

  return e(React.Fragment, null,
    e("div", { className: "wrap" },
      e("div", { className: "topbar" },
        e("a", { className: "back", href: "/" }, "← AVALEHT"),
        e("div", { className: "iconbtns" },
          e("button", { className: "icobtn", onClick: () => { AudioEngine.playSfx("click"); setBoardOpen(true); }, title: "Edetabel" }, "🏆"),
          e("button", {
            className: "icobtn" + (musicOn ? "" : " off"),
            onClick: () => { const v = !musicOn; setMusicOnState(v); AudioEngine.setMusic(v); }, title: "Muusika"
          }, "🎵"),
          e("button", {
            className: "icobtn" + (sfxOn ? "" : " off"),
            onClick: () => { const v = !sfxOn; setSfxOnState(v); AudioEngine.setSfx(v); AudioEngine.playSfx("click"); }, title: "Heliefektid"
          }, "🔊"),
          e("button", {
            className: "icobtn" + (turbo ? " turbo-on" : ""),
            onClick: () => { AudioEngine.playSfx("click"); setTurbo(t => !t); }, title: "Turbo"
          }, "⚡"))),
      e("div", { className: "hdr" },
        e("h1", null, "KosmosBet"),
        e("p", null, "kosmose klastrislott")),

      fs ? e("div", { className: "fsbanner" },
        e("span", null, "🕳️ Tasuta keerutused: ", e("b", null, fs.remaining)),
        e("span", null, "Võit: ", e("b", null, fmt(fs.win || 0)))) : null,

      e("div", { className: "board-outer" },
        e("div", { className: "board" }, cellBgs, rings, tileEls, particleEls)),

      e("div", { className: "statrow" },
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Saldo"),
          e("div", { className: "val" }, fmt(balance))),
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Panus"),
          e("div", { className: "val", style: { color: "var(--cyan)" } }, fmt(bet))),
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Võit"),
          e("div", { className: "val winval" }, fmt(winDisplay)))),

      e("div", { className: "controls" },
        e("div", { className: "betbox" },
          e("button", {
            className: "stepbtn", disabled: spinning || betIdx === 0,
            onClick: () => { AudioEngine.playSfx("click"); setBetIdx(i => Math.max(0, i - 1)); }
          }, "−"),
          e("div", { className: "betval" }, fmt(bet)),
          e("button", {
            className: "stepbtn", disabled: spinning || betIdx === BETS.length - 1,
            onClick: () => { AudioEngine.playSfx("click"); setBetIdx(i => Math.min(BETS.length - 1, i + 1)); }
          }, "+")),
        e("button", { className: "spinbtn", disabled: spinning, onClick: () => doSpin(false) },
          spinning ? "..." : "KEERUTA 🚀")),

      e("button", {
        className: "buybtn", disabled: spinning || !buyAllowed,
        onClick: () => doSpin(true),
        title: buyAllowed ? "" : "Boonusost lubatud vaid panustel 0.2, 0.4 ja 1.0"
      }, buyAllowed ? "🕳️ OSTA BOONUS — " + fmt(buyCost) : "🕳️ OSTA BOONUS (panus max 1.00)"),

      e("p", { className: "capnote" },
        sessionBest > 0 ? "Sessiooni suurim võit: " + fmt(sessionBest) + " · " : "",
        "Mänguraha — päris raha siin ei liigu. Max võit 5000x panus.")),

    toast ? e("div", { className: "toast" }, toast) : null,
    ovl, boardOvl);
}

ReactDOM.createRoot(document.getElementById("app")).render(e(App));
</script>
</body>
</html>
