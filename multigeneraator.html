</style>

function chipText(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55 ? "#14141a" : "#ffffff";

/* Turud: igal turul nimi + valikute loend antud mängu kohta */
const MARKETS = [
  { name: "Lõpptulemus", sels: f => [
    { label: f.home, odds: f.h, team: f.home },
    { label: "Viik", odds: f.d },
    { label: f.away, odds: f.a, team: f.away }
  ]},

    { label: "Üle 2.5", odds: f.over },

  { name: "Mõlemad skoorivad", sels: f => [
    { label: "Jah", odds: f.bttsY },
    { label: "Ei", odds: f.bttsN }
  ]}
];

const MIN_LEGS = 3, MAX_LEGS = 10;
const BUYINS = [5, 50, 100];
/* bet365 acca boonuse maksimumid: 3→5% … 10→40% */
function maxBoost(legCount) { return (legCount - 2) * 5; }

function randInt(n) { return Math.floor(Math.random() * n); }
function pick(arr) { return arr[randInt(arr.length)]; }
function round2(x) { return Math.round(x * 100) / 100; }
function fmt2(x) { return (+x).toFixed(2); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function buzz(pattern) { if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} } }

function makeLeg(fixture) {
  const market = pick(MARKETS);
  const sel = pick(market.sels(fixture));
  return {
    fixtureId: fixture.id, home: fixture.home, away: fixture.away, ko: fixture.ko,
    market: market.name, selection: sel.label, team: sel.team || null, odds: sel.odds
  };
}

/* Genereeri pilet: igale valikule eri mäng, turg ja valik ühtlaselt juhuslikud */
function generateTicket(legCount) {
  const fx = FIXTURES.slice();
  for (let i = fx.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [fx[i], fx[j]] = [fx[j], fx[i]];
  }
  return fx.slice(0, legCount).map(makeLeg);
}

function rawOddsOf(legs) { return round2(legs.reduce((p, l) => p * l.odds, 1)); }

/* ============================================================
   Heliefektid (Web Audio, failideta)
   ============================================================ */
const SFX = (() => {
  let ctx = null;
  let on = localStorage.getItem("multi_sfx") !== "0";
  function ac() {
    if (!on) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }
  function beep(freq, dur, type, gain, slideTo) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + dur);
    g.gain.setValueAtTime(gain || .08, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  }
  return {
    isOn: () => on,
    toggle() { on = !on; localStorage.setItem("multi_sfx", on ? "1" : "0"); return on; },
    click() { beep(700, .06, "square", .05); },
    tick() { beep(1500 + Math.random() * 600, .025, "square", .025); },
    snap() { beep(420, .09, "square", .09); setTimeout(() => beep(880, .12, "sine", .1), 45); },
    boostTick() { beep(900 + Math.random() * 500, .03, "square", .04); },
    boost() { [520, 660, 880].forEach((f, i) => setTimeout(() => beep(f, .16, "sine", .1), i * 90)); },
    fanfare() { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, .3, "sine", .12), i * 110)); },
    dud() { beep(300, .25, "sine", .07, 160); }
  };
})();

/* ============================================================
   Konfetid
   ============================================================ */
const Confetti = (() => {
  const cv = document.getElementById("confetti");
  const cx = cv.getContext("2d");
  let parts = [], raf = null;
  function resize() { cv.width = innerWidth; cv.height = innerHeight; }
  resize(); addEventListener("resize", resize);
  const COLORS = ["#ffd54f", "#00e676", "#ff5c6c", "#4de8ff", "#ffffff", "#ff9052"];
  function burst(n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 8;
      parts.push({
        x: cv.width / 2 + (Math.random() - .5) * cv.width * .4,
        y: cv.height * .35 + (Math.random() - .5) * 60,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
        w: 5 + Math.random() * 6, h: 3 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - .5) * .3,
        col: pick(COLORS), life: 90 + Math.random() * 60
      });
    }
    if (!raf) loop();
  }
  function loop() {
    raf = requestAnimationFrame(loop);
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);
    if (!parts.length) { cancelAnimationFrame(raf); raf = null; return; }
    for (const p of parts) {
      p.vy += .18; p.x += p.vx; p.y += p.vy; p.vx *= .985; p.rot += p.vr; p.life--;
      cx.save();
      cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.globalAlpha = Math.min(1, p.life / 40);
      cx.fillStyle = p.col;
      cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
    }
  }
  return { burst };
})();

/* ============================================================
   Rakendus
   ============================================================ */
const { useState, useEffect, useRef } = React;
const e = React.createElement;

function TeamChip(props) {
  const col = TEAM_COLORS[props.name] || "#666";
  return e("span", { className: "chip", style: { background: col, color: chipText(col) } }, props.name);
}

function SelText(props) {
  if (props.team) {
    const col = TEAM_COLORS[props.team] || "#fff";
    const light = chipText(col) === "#14141a";
    return e("span", {
      className: "selname",
      style: light
        ? { color: col, textShadow: "0 0 1px rgba(255,255,255,.9), 0 0 6px rgba(255,255,255,.35)" }
        : { color: col, filter: "brightness(1.6)" }
    }, props.label);
  }
  return e("span", { className: "selname" }, props.label);
}

function LegRow(props) {
  const l = props.leg;
  return e(React.Fragment, null,
    e("div", { className: "fixline" },
      e(TeamChip, { name: l.home }), e("span", { className: "vs" }, "–"), e(TeamChip, { name: l.away }),
      e("span", { className: "kotime" }, l.ko)),
    e("div", { className: "selline" },
      e("span", { className: "mkt" }, l.market + ":"),
      e(SelText, { team: l.team, label: l.selection }),
      e("span", { className: "odds" }, fmt2(l.odds))));
}

function App() {
  const [phase, setPhase] = useState("setup");           // setup | spin | ticket
  const [legCount, setLegCount] = useState(() => {
    const v = parseInt(localStorage.getItem("multi_legs"), 10);
    return v >= MIN_LEGS && v <= MAX_LEGS ? v : 5;
  });
  const [buyIn, setBuyIn] = useState(() => {
    const v = parseInt(localStorage.getItem("multi_buyin"), 10);
    return BUYINS.includes(v) ? v : 5;
  });
  const [sfxOn, setSfxOn] = useState(SFX.isOn());

  const [ticket, setTicket] = useState(null);            // { legs, legCount, buyIn, raw, boost, boosted, win }
  const [locked, setLocked] = useState(0);
  const [preview, setPreview] = useState(null);
  const [boostView, setBoostView] = useState(null);      // { max, hot, done, pct }
  const [saveState, setSaveState] = useState(null);      // saving | ok | err
  const [shake, setShake] = useState(false);

  const [boardOpen, setBoardOpen] = useState(false);
  const [boardRows, setBoardRows] = useState(null);
  const [boardErr, setBoardErr] = useState(null);
  const [toast, setToast] = useState(null);

  const spinningRef = useRef(false);
  const toastTimer = useRef(null);

  useEffect(() => { localStorage.setItem("multi_legs", String(legCount)); }, [legCount]);
  useEffect(() => { localStorage.setItem("multi_buyin", String(buyIn)); }, [buyIn]);

  function showToast(msg, ms) {
    clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => setToast(null), ms || 2400);
  }

  function withTimeout(p, ms) {
    return Promise.race([
      Promise.resolve(p),
      new Promise((_, rej) => setTimeout(() => rej(new Error("Ajalõpp — server ei vasta")), ms))
    ]);
  }

  async function saveTicket(t) {
    if (!sb) { setSaveState("err"); return; }
    setSaveState("saving");
    for (let attempt = 1; attempt <= 2; attempt++) {
      try {
        const { error } = await withTimeout(sb.from("multi_tickets").insert({
          legs: t.legs, leg_count: t.legCount, buy_in: t.buyIn,
          raw_odds: t.raw, boost_pct: t.boost, boosted_odds: t.boosted, potential_win: t.win
        }), 15000);
        if (error) throw error;
        setSaveState("ok");
        return;
      } catch (err) { console.error("Pileti salvestus (katse " + attempt + "):", err); }
    }
    setSaveState("err");
  }

  async function loadBoard(attempt) {
    attempt = attempt || 1;
    setBoardErr(null); setBoardRows(null);
    try {
      const { data, error } = await withTimeout(sb.from("multi_tickets")
        .select("leg_count,buy_in,boost_pct,boosted_odds,potential_win")
        .order("potential_win", { ascending: false })
        .limit(10), 15000);
      if (error) throw new Error(error.message + (error.code ? " (" + error.code + ")" : ""));
      setBoardRows(data || []);
    } catch (err) {
      if (attempt < 2) return loadBoard(attempt + 1);
      setBoardErr(err.message);
    }
  }
  useEffect(() => { if (boardOpen && sb) loadBoard(); }, [boardOpen]);

  /* ---------- keerutus ---------- */
  async function runSpin() {
    if (spinningRef.current) return;
    spinningRef.current = true;

    const legs = generateTicket(legCount);
    const max = maxBoost(legCount);
    const boostPct = 5 * randInt(max / 5 + 1);   // 0..max, 5% samm, ühtlane
    const raw = rawOddsOf(legs);
    const boosted = round2(raw * (1 + boostPct / 100));
    const win = round2(buyIn * boosted);

    setTicket({ legs, legCount, buyIn, raw, boost: boostPct, boosted, win });
    setLocked(0); setBoostView(null); setSaveState(null);
    setPhase("spin");
    SFX.click();
    await sleep(350);

    /* valikud lukustuvad ükshaaval, enne kiire "slotika" tsükkel */
    for (let i = 0; i < legs.length; i++) {
      const dur = i === 0 ? 1050 : 720;
      const t0 = Date.now();
      while (Date.now() - t0 < dur) {
        setPreview(makeLeg(pick(FIXTURES)));
        SFX.tick();
        await sleep(70);
      }
      setPreview(null);
      setLocked(i + 1);
      SFX.snap(); buzz(35);
      await sleep(150);
    }

    /* boosti keerutus */
    await sleep(450);
    const chips = max / 5 + 1;                    // nt 6 valikut → 5 chippi (0..20%)
    const target = boostPct / 5;
    setBoostView({ max, hot: 0, done: false, pct: boostPct });
    buzz(20);
    const seq = [];
    const loops = 3;
    for (let r = 0; r < loops; r++) for (let i = 0; i < chips; i++) seq.push(i);
    let i = (target + 1) % chips;
    while (i !== target) { seq.push(i); i = (i + 1) % chips; }
    seq.push(target);
    for (let k = 0; k < seq.length; k++) {
      const prog = k / (seq.length - 1);
      setBoostView({ max, hot: seq[k], done: false, pct: boostPct });
      SFX.boostTick();
      await sleep(55 + 260 * prog * prog);
    }
    setBoostView({ max, hot: target, done: true, pct: boostPct });

    if (boostPct === max) {
      SFX.fanfare(); buzz([60, 40, 60, 40, 120]);
      Confetti.burst(240);
      setShake(true); setTimeout(() => setShake(false), 750);
      await sleep(1900);
    } else if (boostPct > 0) {
      SFX.boost(); buzz(60);
      Confetti.burst(90);
      await sleep(1400);
    } else {
      SFX.dud();
      await sleep(1000);
    }

    setPhase("ticket");
    spinningRef.current = false;
    saveTicket({ legs, legCount, buyIn, raw, boost: boostPct, boosted, win });
  }

  /* ---------- vaated ---------- */
  const topbar = e("div", { className: "topbar" },
    e("a", { className: "back", href: "/" }, "← AVALEHT"),
    e("div", { className: "iconbtns" },
      e("button", { className: "icobtn", title: "Edetabel", onClick: () => { SFX.click(); setBoardOpen(true); } }, "🏆"),
      e("button", {
        className: "icobtn" + (sfxOn ? "" : " off"), title: "Heliefektid",
        onClick: () => { setSfxOn(SFX.toggle()); SFX.click(); }
      }, "🔊")));

  const hdr = e("div", { className: "hdr" },
    e("h1", null, "Multi Generaator"),
    e("p", null, "EPL avavooru mitmikpanus"));

  let body = null;

  if (phase === "setup") {
    body = e("div", { className: "setup" },
      e("div", { className: "optlbl" }, "Valikute arv"),
      e("div", { className: "stepper" },
        e("button", {
          className: "stepbtn", disabled: legCount <= MIN_LEGS,
          onClick: () => { SFX.click(); setLegCount(c => Math.max(MIN_LEGS, c - 1)); }
        }, "−"),
        e("div", { className: "stepval" },
          e("b", null, legCount),
          e("small", null, "valikut")),
        e("button", {
          className: "stepbtn", disabled: legCount >= MAX_LEGS,
          onClick: () => { SFX.click(); setLegCount(c => Math.min(MAX_LEGS, c + 1)); }
        }, "+"),
        e("div", { className: "boostmax" },
          e("b", null, "+" + maxBoost(legCount) + "%"),
          e("small", null, "max boost"))),
      e("div", { className: "optlbl" }, "Panus"),
      e("div", { className: "optrow" },
        BUYINS.map(b => e("button", {
          key: b, className: "optbtn" + (buyIn === b ? " on" : ""),
          onClick: () => { SFX.click(); setBuyIn(b); }
        }, b))),
      e("button", { className: "spinbtn", onClick: runSpin }, "KEERUTA 🎰"),
      e("div", { className: "hint" }, legCount + " juhuslikku valikut · boost 0–" + maxBoost(legCount) + "%"));
  }

  if (phase === "spin" && ticket) {
    const slots = [];
    for (let i = 0; i < ticket.legCount; i++) {
      if (i < locked) {
        slots.push(e("div", { className: "slot locked", key: "l" + i },
          e("span", { className: "slotnum" }, (i + 1) + "/" + ticket.legCount),
          e(LegRow, { leg: ticket.legs[i] })));
      } else if (i === locked && preview) {
        slots.push(e("div", { className: "slot cycling", key: "c" + i },
          e("span", { className: "slotnum" }, (i + 1) + "/" + ticket.legCount),
          e("div", { className: "cycrow" }, e(LegRow, { leg: preview }))));
      } else {
        slots.push(e("div", { className: "slot empty", key: "e" + i }, "· · ·"));
      }
    }
    let boostBox = null;
    if (boostView) {
      const chips = [];
      for (let i = 0; i <= boostView.max / 5; i++) {
        const cls = "bchip" +
          (boostView.done && i === boostView.hot ? " final" : (!boostView.done && i === boostView.hot ? " hot" : ""));
        chips.push(e("div", { className: cls, key: i }, i === 0 ? "0%" : "+" + i * 5 + "%"));
      }
      let res = null;
      if (boostView.done) {
        res = boostView.pct === boostView.max
          ? e("div", { className: "boostres max" }, "🎉 MAKSIMUM BOOST +" + boostView.pct + "%!")
          : boostView.pct > 0
            ? e("div", { className: "boostres some" }, "Boost +" + boostView.pct + "%!")
            : e("div", { className: "boostres none" }, "Seekord boosti ei tulnud…");
      } else {
        res = e("div", { className: "boostres" });
      }
      boostBox = e("div", { className: "boostbox" },
        e("div", { className: "spintitle", style: { margin: 0 } }, "⚡ Boosti keerutus"),
        e("div", { className: "boostreel" }, chips),
        res);
    }
    body = e("div", { className: "spinstage" },
      e("div", { className: "spintitle" },
        locked < ticket.legCount ? "Genereerin piletit…" : boostView && !boostView.done ? "Keerutan boosti…" : "Pilet valmis!"),
      slots, boostBox);
  }

  if (phase === "ticket" && ticket) {
    const t = ticket;
    body = e(React.Fragment, null,
      e("div", { className: "receipt" },
        e("div", { className: "rc-head" },
          e("h2", null, "🎰 Multi Generaator"),
          e("p", null, t.legCount + " valikut · panus " + t.buyIn)),
        t.legs.map((l, i) => e("div", { className: "rc-leg", key: i }, e(LegRow, { leg: l }))),
        e("div", { className: "rc-foot" },
          e("div", { className: "rc-row" },
            e("span", { className: "rc-lbl" }, "Koefitsient"),
            e("span", null,
              e("span", { className: "raw-odds" + (t.boost > 0 ? " cut" : "") }, fmt2(t.raw)),
              t.boost > 0 ? e("span", { style: { marginLeft: 8 } },
                e("span", { className: "boostbadge" }, "+" + t.boost + "%"),
                e("span", { className: "boosted-odds", style: { marginLeft: 8 } }, fmt2(t.boosted))) : null)),
          e("div", { className: "rc-row" },
            e("span", { className: "rc-lbl" }, "Võimalik võit"),
            e("span", { className: "potwin" }, fmt2(t.win))),
          saveState === "saving" ? e("div", { className: "savestate", style: { paddingTop: 8 } }, "Salvestan edetabelisse…") :
            saveState === "ok" ? e("div", { className: "savestate", style: { paddingTop: 8 } }, "✓ Pilet salvestatud edetabelisse") :
              saveState === "err" ? e("div", { className: "savestate err", style: { paddingTop: 8 } }, "Salvestamine ebaõnnestus — server ei vasta") : null)),
      e("button", { className: "mainbtn", onClick: runSpin }, "KEERUTA UUESTI 🎰"),
      e("button", { className: "ghostbtn", onClick: () => { SFX.click(); setPhase("setup"); } }, "Muuda valikuid"),
      e("a", { className: "ghostbtn", href: "/" }, "← Tagasi avalehele"));
  }

  const boardOvl = boardOpen ? e("div", {
    className: "ovl",
    onClick: ev => { if (ev.target === ev.currentTarget) setBoardOpen(false); }
  },
    e("div", { className: "panel" },
      e("h2", { style: { marginBottom: 4, textAlign: "center" } }, "🏆 Edetabel"),
      e("p", { style: { textAlign: "center", fontSize: 11, color: "var(--inkSoft)", fontWeight: 800, marginBottom: 14 } },
        "suurimad võimalikud võidud"),
      boardErr ? e("div", null,
        e("div", { className: "db-error" }, "Laadimine ebaõnnestus: " + boardErr),
        e("div", { style: { textAlign: "center", marginTop: 10 } },
          e("button", { className: "ghostbtn", onClick: () => loadBoard() }, "Proovi uuesti 🔄"))) :
        boardRows == null ? e("div", { className: "board-empty" }, "Laen…") :
          boardRows.length === 0 ? e("div", { className: "board-empty" }, "Ole esimene! Keeruta endale multi ja pääse edetabelisse.") :
            boardRows.map((r, i) => e("div", { className: "board-row", key: i },
              e("span", { className: "board-rank" }, i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1) + "."),
              e("span", { className: "board-name" }, r.leg_count + " valikut"),
              e("span", { className: "board-meta" }, "panus " + (+r.buy_in) + " · +" + r.boost_pct + "%"),
              e("span", { className: "board-amt" }, fmt2(+r.potential_win)))),
      e("button", { className: "ghostbtn", style: { marginTop: 14 }, onClick: () => setBoardOpen(false) }, "Sulge"))) : null;

  return e(React.Fragment, null,
    e("div", { className: "wrap" + (shake ? " shake" : "") }, topbar, hdr, body),
    boardOvl,
    toast ? e("div", { className: "toast" }, toast) : null);
}

ReactDOM.createRoot(document.getElementById("app")).render(e(App));
</script>
