<style>

  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { min-height:100%; }
  body {

    font-size:14px; font-weight:700; cursor:pointer; text-align:left; line-height:1.35;

  .btn:hover { border-color:var(--accent); }
  .btn-primary {

  ],
  economy: [
    [0,'breathing'],[20,'tight'],[35,'on an IMF leash'],[50,'strained'],[65,'bleeding'],[85,'rupee free-fall']
  ]
};

function pressureLabel(key, v){
  const rows = LABEL[key];
  let name = rows[0][1];
  for (const [t,n] of rows) if (v >= t) name = n;
  let cls = 'cool';
  if (v >= 85) cls = 'crit';
  else if (v >= 70) cls = 'boil';
  else if (v >= 45) cls = 'hot';
  else if (v >= 25) cls = 'ok';
  return { name, cls };
}

function driftPhrase(key, delta){
  const map = {
    establishment: { neg:'Establishment cooler', pos:'Establishment colder', zero:'Establishment steady' },
    street: { neg:'Street cooler', pos:'Street hotter', zero:'Street steady' },
    coalition: { neg:'Coalition happier', pos:'Coalition sour', zero:'Coalition steady' },
    economy: { neg:'Economy calmer', pos:'Economy worse', zero:'Economy steady' }
  };
  // Special sample phrases for economy/establishment when annoyed
  if (key === 'economy' && delta > 0) return 'Economy IMF annoyed';
  if (key === 'establishment' && delta > 0 && delta < 8) return 'Establishment unimpressed';
  if (key === 'establishment' && delta >= 8) return 'Establishment furious';
  if (key === 'street' && delta < 0) return 'Street cooler';
  if (key === 'street' && delta > 0) return 'Street hotter';
  if (key === 'coalition' && delta > 0) return 'Coalition sour';
  if (key === 'coalition' && delta < 0) return 'Coalition steadier';
  if (key === 'economy' && delta < 0) return 'Economy breathing';
  const m = map[key];
  if (delta > 0) return m.pos;
  if (delta < 0) return m.neg;
  return m.zero;
}

function clamp(n){ return Math.max(0, Math.min(100, Math.round(n))); }

function freshState(){
  return {
    week: 1,
    cycle: 0,
    p: { establishment: 38, street: 52, coalition: 28, economy: 46 },
    relations: REL_START.map(r => ({...r})),
    lastCrisis: null,
    history: []
  };
}

function save(state){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(SAVE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function isUnlocked(){ try{ return localStorage.getItem(UNLOCK_KEY)==='1'; }catch(e){ return false; } }
function setUnlocked(){ try{ localStorage.setItem(UNLOCK_KEY,'1'); }catch(e){} }
function clearUnlock(){ try{ localStorage.removeItem(UNLOCK_KEY); }catch(e){} }

let state = null;
let pendingChoice = null;
let usedCrisis = {};

function $(id){ return document.getElementById(id); }
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function pickTicker(weekDef, weekNum){
  const arr = weekDef.tickers || TICKER_POOL;
  return arr[(weekNum + (state.cycle||0)*3) % arr.length];
}

function baseWeekIndex(weekNum){
  return (weekNum - 1) % WEEKS.length;
}

function getEventForState(s){
  // Crisis amplifiers when hot, not same crisis twice in a row, prefer unused in cycle
  const crises = CRISES.filter(c => c.when(s) && c.id !== s.lastCrisis);
  if (crises.length){
    // Prefer one not used this cycle
    const fresh = crises.filter(c => !usedCrisis[c.id]);
    const pool = fresh.length ? fresh : crises;
    return { type:'crisis', def: pool[s.week % pool.length] };
  }
  const def = WEEKS[baseWeekIndex(s.week)];
  return { type:'week', def };
}

function renderPressures(){
  const keys = [
    ['establishment','Establishment'],
    ['street','Street'],
    ['coalition','Coalition'],
    ['economy','Economy']
  ];
  $('pressures').innerHTML = keys.map(([k,label]) => {
    const {name, cls} = pressureLabel(k, state.p[k]);
    return `<div class="p-card"><div class="p-name">${label}</div><div class="p-label ${cls}">${name}</div></div>`;
  }).join('');
}

function renderRelations(){
  $('relations').innerHTML = state.relations.map(r => `<span class="rel">${r.label}</span>`).join('');
}

function renderPlay(){
  const ev = getEventForState(state);
  const def = ev.def;
  $('weekPill').textContent = 'Week ' + state.week;
  renderPressures();
  renderRelations();
  $('tickerText').textContent = pickTicker(def, state.week);
  $('brief').textContent = def.brief;
  $('opts').innerHTML = '';
  def.options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = opt.t;
    b.onclick = () => choose(opt, ev);
    $('opts').appendChild(b);
  });
  show('screenPlay');
}

function applyDrift(d){
  const before = {...state.p};
  for (const k of Object.keys(d)){
    state.p[k] = clamp(state.p[k] + d[k]);
  }
  const chips = [];
  for (const k of ['establishment','street','coalition','economy']){
    const delta = state.p[k] - before[k];
    if (!d.hasOwnProperty(k) && delta === 0) continue;
    if (!d.hasOwnProperty(k)) continue;
    const phrase = driftPhrase(k, d[k]);
    const cls = d[k] > 0 ? 'down' : (d[k] < 0 ? 'up' : 'flat');
    // Note: for pressures, higher = worse, so positive drift = "down" (bad for player) visually
    chips.push({ phrase, cls, delta: d[k] });
  }
  return chips;
}

function checkLoss(){
  const order = [
    ['street', EPILOGUES.street],
    ['establishment', EPILOGUES.establishment],
    ['coalition', EPILOGUES.coalition],
    ['economy', EPILOGUES.economy]
  ];
  // Highest over critical wins the naming
  let best = null, bestV = CRITICAL - 1;
  for (const [k, epi] of order){
    if (state.p[k] >= CRITICAL && state.p[k] > bestV){
      bestV = state.p[k]; best = { key:k, epi };
    }
  }
  return best;
}

function choose(opt, ev){
  const chips = applyDrift(opt.d);
  if (ev.type === 'crisis'){
    state.lastCrisis = ev.def.id;
    usedCrisis[ev.def.id] = true;
  } else {
    state.lastCrisis = null;
  }
  state.history.push({ week: state.week, id: ev.def.id, choice: opt.t });
  pendingChoice = { opt, chips };
  save(state);

  $('resultTitle').textContent = opt.title;
  $('resultBody').textContent = opt.body;
  $('resultTeach').textContent = opt.teach;
  $('resultDrift').innerHTML = chips.map(c =>
    `<span class="chip ${c.cls}">${c.phrase}</span>`
  ).join('');
  show('screenResult');
}

function advance(){
  const loss = checkLoss();
  if (loss){
    clearSave();
    $('endTag').textContent = loss.epi.tag;
    $('endTitle').textContent = loss.epi.title;
    $('endBody').textContent = loss.epi.body;
    $('endStats').textContent = `Survived ${state.week} week${state.week===1?'':'s'} · Exit: ${loss.key}`;
    show('screenEnd');
    return;
  }
  state.week += 1;
  if (state.week > 12 && (state.week - 1) % 12 === 0){
    state.cycle += 1;
    usedCrisis = {};
  }
  save(state);
  renderPlay();
}

function startNew(){
  state = freshState();
  usedCrisis = {};
  pendingChoice = null;
  save(state);
  renderPlay();
}

function goMenu(){
  const s = load();
  if (s && s.week){
    $('continueBtn').style.display = 'block';
  } else {
    $('continueBtn').style.display = 'none';
  }
  show('screenMenu');
}

// Wire UI
$('pwBtn').onclick = () => {
  const v = ($('pwInput').value || '').trim().toLowerCase();
  if (v === PASSWORD){
    setUnlocked();
    $('pwErr').textContent = '';
    goMenu();
  } else {
    $('pwErr').textContent = 'Wrong password.';
  }
};
$('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('pwBtn').click(); });

$('continueBtn').onclick = () => {
  state = load();
  if (!state) { startNew(); return; }
  usedCrisis = {};
  renderPlay();
};
$('newGameBtn').onclick = () => startNew();
$('lockBtn').onclick = () => { clearUnlock(); show('screenGate'); };
$('nextWeekBtn').onclick = () => advance();
$('saveQuitBtn').onclick = () => { save(state); goMenu(); };
$('abandonBtn').onclick = () => {
  if (confirm('Abandon this run and start a new game?')){ clearSave(); startNew(); }
};
$('endNewBtn').onclick = () => startNew();
$('endMenuBtn').onclick = () => { clearSave(); goMenu(); };

// boot
if (isUnlocked()) goMenu();
else show('screenGate');
})();
