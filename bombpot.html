<script>
"use strict";
/* ============================================================
   Supabase (sama projekt nagu teised beebibet mängud)
   ============================================================ */
const SUPABASE_URL = "https://thrsacygpqwbnkcppmpk.supabase.co";
const SUPABASE_KEY = "sb_publishable_-QaY7mGpitakhestu3w1fg_sCGquRvx";
let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (err) { console.error("Supabase init:", err); }

const M = BombpotMath;

// Pokkerihindaja mõistlikkuskontrollid — ava konsool, et tulemusi näha
// (ratasrida, Omaha "täpselt 2" reegel, poti jagamine viigi korral jm)
try { M.runChecks(); } catch (err) { console.error("runChecks:", err); }

/* ============================================================
   Taustadekoratsioon
   ============================================================ */
(function deco() {
  const d = document.getElementById("deco");
  ["♠", "♥", "♦", "♣", "💣", "♠", "♥", "🃏"].forEach((t, i) => {
    const s = document.createElement("span");
    s.textContent = t;
    s.style.left = [6, 84, 12, 90, 46, 70, 30, 60][i] + "%";
    s.style.top = [10, 6, 72, 58, 88, 30, 40, 78][i] + "%";
    s.style.animation = "float" + (i % 3) + " " + (6 + i) + "s ease-in-out infinite";
    d.appendChild(s);
  });
})();

/* ============================================================
   Helimootor (Web Audio, failideta)
   ============================================================ */
const AudioEngine = (() => {
  let ctx = null, sfxBus = null;
  let sfxOn = localStorage.getItem("bombpot_sfx") !== "0";

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      sfxBus = ctx.createGain(); sfxBus.gain.value = sfxOn ? .7 : 0; sfxBus.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }

  function tone(freq, dur, opts) {
    if (!ctx) return;
    opts = opts || {};
    const t = ctx.currentTime + (opts.delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = opts.type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(opts.vol != null ? opts.vol : .25, t + .012);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + dur + .05);
  }

  function playSfx(name) {
    if (!sfxOn || !ensure()) return;
    switch (name) {
      case "click": tone(660, .07, { type: "triangle", vol: .18 }); break;
      case "allin":
        tone(196, .16, { type: "square", vol: .22 });
        tone(147, .22, { type: "square", vol: .22, delay: .09 });
        tone(392, .3, { type: "sawtooth", vol: .12, delay: .2, slide: 588 });
        break;
      case "flip":
        tone(340, .06, { type: "triangle", vol: .2 });
        tone(510, .05, { type: "triangle", vol: .14, delay: .04 });
        break;
      case "win":
        [523, 659, 784].forEach((f, i) => tone(f, .18, { type: "triangle", vol: .22, delay: i * .09 }));
        break;
      case "bigwin":
        [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, { type: "triangle", vol: .24, delay: i * .1 }));
        tone(262, .8, { type: "sawtooth", vol: .08, delay: .1 });
        break;
      case "lose":
        tone(320, .28, { type: "sawtooth", vol: .12, slide: 170 });
        break;
    }
  }

  function setSfx(v) {
    sfxOn = v; localStorage.setItem("bombpot_sfx", v ? "1" : "0");
    if (ensure() && sfxBus) sfxBus.gain.value = v ? .7 : 0;
  }

  return { playSfx, setSfx, get sfxOn() { return sfxOn; } };
})();

/* ============================================================
   React UI
   ============================================================ */
const e = React.createElement;
const { useState, useEffect, useRef } = React;

const START_STAKE = 100, BET = 10, TOTAL_BETS = 10;
const OPP_NAMES = ["Fill Aivi", "Doil Branson", "Filip Hellmutt"];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => { const v = Math.round(+n * 100) / 100; return Number.isInteger(v) ? String(v) : v.toFixed(2); };

// Vastased saavad igal panusel juhuslikus järjekorras nimed nimepoolist;
// kui vastaseid on rohkem kui nimesid, saavad ülejäänud numbri.
function assignNames(opponents) {
  const pool = OPP_NAMES.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  const names = ["Sina"];
  for (let i = 1; i <= opponents; i++) names.push(pool[i - 1] || "Vastane " + i);
  return names;
}

function App() {
  const [stake, setStake] = useState(START_STAKE);
  const [winnings, setWinnings] = useState(0);
  const [betsDone, setBetsDone] = useState(0);
  const [bestPot, setBestPot] = useState(0);

  const [opp, setOpp] = useState(2);
  const [variant, setVariant] = useState("holdem");
  const [nBoards, setNBoards] = useState(1);
  const [dealMode, setDealMode] = useState(localStorage.getItem("bombpot_dealmode") || "manual");

  const [phase, setPhase] = useState("setup"); // setup | dealing | result
  const [deal, setDeal] = useState(null);
  const [reveal, setReveal] = useState(0);     // avatud lauakaarte laua kohta (0/3/4/5)
  const [outcome, setOutcome] = useState(null);

  const [overlay, setOverlay] = useState(null);
  const [boardOpen, setBoardOpen] = useState(false);
  const [boardRows, setBoardRows] = useState(null);
  const [boardErr, setBoardErr] = useState(null);
  const [nameVal, setNameVal] = useState(localStorage.getItem("bombpot_name") || "");
  const [toast, setToast] = useState(null);
  const [sfxOn, setSfxOnState] = useState(AudioEngine.sfxOn);

  const busyRef = useRef(false);
  const rngRef = useRef(M.makeRng());
  const toastRef = useRef(null);

  function showToast(msg, ms) {
    clearTimeout(toastRef.current);
    setToast(msg);
    toastRef.current = setTimeout(() => setToast(null), ms || 2200);
  }

  /* ---------- edetabel ---------- */

  // Ära lase rippuval võrgupäringul UI-d blokeerida
  function withTimeout(p, ms) {
    return Promise.race([
      Promise.resolve(p),
      new Promise((_, rej) => setTimeout(() => rej(new Error("Ajalõpp — server ei vasta")), ms))
    ]);
  }

  // Taustal salvestus, kuni 2 katset; tagastab kas õnnestus.
  // Pikk ajalõpp: uinunud Supabase või aeglane mobiilivõrk vajab aega.
  async function submitScore(score) {
    const name = nameVal.trim();
    if (!name || !sb) return false;
    localStorage.setItem("bombpot_name", name);
    for (let attempt = 1; attempt <= 2; attempt++) {
      try {
        const { error } = await withTimeout(sb.from("bombpot_scores").insert({ name, score }), 15000);
        if (error) throw error;
        return true;
      } catch (err) { console.error("Edetabeli salvestus (katse " + attempt + "):", err); }
    }
    return false;
  }

  async function loadBoard(attempt) {
    attempt = attempt || 1;
    setBoardErr(null); setBoardRows(null);
    try {
      const { data, error } = await withTimeout(sb.from("bombpot_scores")
        .select("name,score")
        .order("score", { ascending: false })
        .limit(10), 15000);
      if (error) throw new Error(error.message + (error.code ? " (" + error.code + ")" : ""));
      setBoardRows(data || []);
    } catch (err) {
      if (attempt < 2) return loadBoard(attempt + 1);
      setBoardErr(err.message);
    }
  }
  useEffect(() => { if (boardOpen && sb) loadBoard(); }, [boardOpen]);

  /* ---------- panus ---------- */

  const pendingRef = useRef(null);

  // Arveldus: iga laud = pot / laudade arv, viik jagab võrdselt
  function finishBet() {
    const { d, pot } = pendingRef.current;
    const half = pot / d.boards.length;
    let total = 0;
    const boardsOut = d.boards.map(b => {
      const s = M.settleBoard(d.hands, b, d.variant);
      const share = half / s.winners.length;
      const mine = s.winners.indexOf(0) >= 0 ? share : 0;
      total += mine;
      const used = {};
      s.winners.forEach(w => s.results[w].cards.forEach(c => { used[c] = 1; }));
      return { winners: s.winners, hand: M.handName(s.bestScore), share, mine, used };
    });
    total = Math.round(total * 100) / 100;

    setOutcome({ boards: boardsOut, total });
    if (total > 0) {
      setWinnings(w => Math.round((w + total) * 100) / 100);
      setBestPot(p => Math.max(p, total));
    }
    AudioEngine.playSfx(total >= pot ? "bigwin" : total > 0 ? "win" : "lose");
    setPhase("result");
  }

  async function allIn() {
    if (busyRef.current || phase !== "setup" || betsDone >= TOTAL_BETS) return;
    busyRef.current = true;
    AudioEngine.playSfx("allin");

    const d = M.dealBet(opp, variant, nBoards, rngRef.current);
    d.variant = variant;
    const pot = (opp + 1) * BET;
    pendingRef.current = { d, pot };
    setStake(s => s - BET);
    setBetsDone(n => n + 1);
    setDeal({ hands: d.hands, boards: d.boards, variant, pot, names: assignNames(opp), mode: dealMode });
    setOutcome(null); setReveal(0); setPhase("dealing");

    if (dealMode === "auto") {
      // Kiirjagamine: taskukaardid lendavad lauale, siis flopp → turn → river
      await sleep(1000);
      AudioEngine.playSfx("flip"); setReveal(3); await sleep(1100);
      AudioEngine.playSfx("flip"); setReveal(4); await sleep(1100);
      AudioEngine.playSfx("flip"); setReveal(5); await sleep(850);
      finishBet();
    }
    busyRef.current = false;
  }

  // Nupuga jagamine: iga vajutus avab järgmise tänava, river arveldab
  async function dealStreet() {
    if (busyRef.current || phase !== "dealing") return;
    AudioEngine.playSfx("flip");
    if (reveal < 3) setReveal(3);
    else if (reveal === 3) setReveal(4);
    else if (reveal === 4) {
      setReveal(5);
      busyRef.current = true;
      await sleep(800);
      finishBet();
      busyRef.current = false;
    }
  }

  function next() {
    AudioEngine.playSfx("click");
    if (betsDone >= TOTAL_BETS) {
      setOverlay({ kind: "gameover" });
    } else {
      setDeal(null); setOutcome(null); setPhase("setup");
    }
  }

  function newSession() {
    AudioEngine.playSfx("click");
    setStake(START_STAKE); setWinnings(0); setBetsDone(0); setBestPot(0);
    setDeal(null); setOutcome(null); setPhase("setup"); setOverlay(null);
  }

  /* ---------- render ---------- */

  const pot = (opp + 1) * BET;

  function cardEl(c, key, extra, delayMs, big) {
    return e("div", {
      key,
      className: "card " + (M.isRed(c) ? "red" : "blk") + (big ? " big" : "") + (extra || ""),
      style: delayMs ? { animationDelay: delayMs + "ms" } : null
    },
      e("span", { className: "crank" }, M.RANK_CHARS[M.rankOf(c)]),
      e("span", { className: "csuit" }, M.SUIT_CHARS[M.suitOf(c)]));
  }

  let main;
  if (!deal) {
    // Seadistuspaneel
    main = e("div", { className: "setup" },
      e("div", { className: "optlbl" }, "Vastaste arv"),
      e("div", { className: "optrow" }, [1, 2, 3, 4, 5].map(n =>
        e("button", {
          key: n, className: "optbtn" + (opp === n ? " on" : ""),
          onClick: () => { AudioEngine.playSfx("click"); setOpp(n); }
        }, String(n)))),
      e("div", { className: "optlbl" }, "Pokkerivariant"),
      e("div", { className: "optrow" },
        e("button", {
          className: "optbtn" + (variant === "holdem" ? " on" : ""),
          onClick: () => { AudioEngine.playSfx("click"); setVariant("holdem"); }
        }, "Hold'em", e("small", null, "2 taskukaarti")),
        e("button", {
          className: "optbtn" + (variant === "omaha" ? " on" : ""),
          onClick: () => { AudioEngine.playSfx("click"); setVariant("omaha"); }
        }, "Omaha", e("small", null, "4 taskukaarti, mängi täpselt 2"))),
      e("div", { className: "optlbl" }, "Laudu"),
      e("div", { className: "optrow" },
        e("button", {
          className: "optbtn" + (nBoards === 1 ? " on" : ""),
          onClick: () => { AudioEngine.playSfx("click"); setNBoards(1); }
        }, "1 laud", e("small", null, "võitja saab kõik")),
        e("button", {
          className: "optbtn" + (nBoards === 2 ? " on" : ""),
          onClick: () => { AudioEngine.playSfx("click"); setNBoards(2); }
        }, "2 lauda", e("small", null, "pott jaguneb pooleks"))),
      e("div", { className: "optlbl" }, "Jagamine"),
      e("div", { className: "optrow" },
        e("button", {
          className: "optbtn" + (dealMode === "manual" ? " on" : ""),
          onClick: () => { AudioEngine.playSfx("click"); setDealMode("manual"); localStorage.setItem("bombpot_dealmode", "manual"); }
        }, "Nupuga", e("small", null, "jaga flopp, turn ja river ise")),
        e("button", {
          className: "optbtn" + (dealMode === "auto" ? " on" : ""),
          onClick: () => { AudioEngine.playSfx("click"); setDealMode("auto"); localStorage.setItem("bombpot_dealmode", "auto"); }
        }, "Kiire", e("small", null, "laud jagatakse automaatselt"))),
      e("div", { className: "potline" }, "Pott", e("b", null, fmt(pot))),
      e("button", { className: "allinbtn", disabled: betsDone >= TOTAL_BETS, onClick: allIn },
        "ALL IN 💥"),
      e("p", { className: "capnote", style: { marginTop: 10 } },
        "Rohkem vastaseid = suurem pott, aga väiksem võiduvõimalus. Kaks lauda jagavad poti pooleks — lihtsam midagi võita, raskem kõike korraga."));
  } else {
    // Mängulaud
    const playerRows = deal.hands.map((h, i) => {
      const isWinner = outcome && outcome.boards.some(b => b.winners.indexOf(i) >= 0);
      let myWin = 0;
      if (outcome) outcome.boards.forEach(b => { if (b.winners.indexOf(i) >= 0) myWin += b.share; });
      const usedAny = c => outcome && isWinner && outcome.boards.some(b => b.winners.indexOf(i) >= 0 && b.used[c]);
      return e("div", { key: i, className: "prow" + (isWinner ? " win" : "") },
        e("div", { className: "pname" }, deal.names[i]),
        e("div", { className: "pcards" }, h.map((c, j) =>
          cardEl(c, c, outcome ? (usedAny(c) ? " used" : (isWinner ? "" : " dim")) : "", (i * 90 + j * 45)))),
        outcome ? e("div", { className: "pwin" + (myWin > 0 ? "" : " zero") },
          myWin > 0 ? "+" + fmt(myWin) : "—") : null);
    });

    const boardBoxes = deal.boards.map((b, bi) => {
      const res = outcome ? outcome.boards[bi] : null;
      let banner = null;
      if (res) {
        const names = res.winners.map(i => deal.names[i]).join(" ja ");
        const won = res.winners.indexOf(0) >= 0;
        banner = e("div", { className: "bresult" },
          e("span", { className: "who" + (won ? "" : " lostb") },
            (won ? "🏆 " : "") + names + (res.winners.length > 1 ? " (viik)" : "") +
            " · +" + fmt(res.share) + (res.winners.length > 1 ? " igaühele" : "")),
          e("span", { className: "hand" }, res.hand));
      }
      return e("div", { key: bi, className: "boardbox" },
        deal.boards.length > 1 ? e("div", { className: "blabel" }, "Laud " + (bi + 1) + " · pott " + fmt(deal.pot / 2)) :
          e("div", { className: "blabel" }, "Laud · pott " + fmt(deal.pot)),
        e("div", { className: "bcards" }, b.map((c, ci) =>
          ci < reveal
            ? cardEl(c, c, res ? (res.used[c] ? " used" : " dim") : "", 0, true)
            : e("div", { key: "s" + ci, className: "slot" }))),
        banner);
    });

    main = e("div", { className: "table" },
      e("div", { className: "potbanner" },
        e("span", null, "💣 Pott: ", e("b", null, fmt(deal.pot))),
        e("span", null, deal.variant === "omaha" ? "Omaha" : "Hold'em",
          deal.boards.length > 1 ? " · 2 lauda" : "")),
      playerRows,
      boardBoxes,
      !outcome && deal.mode === "manual" ? e("button", { className: "contbtn", onClick: dealStreet },
        reveal < 3 ? "Jaga flopp 🃏" : reveal === 3 ? "Jaga turn 🃏" : "Jaga river 🃏") : null,
      outcome ? e("div", { className: "betresult" },
        e("div", { className: "amt" + (outcome.total > 0 ? "" : " zero") },
          outcome.total > 0 ? "+" + fmt(outcome.total) + " 💰" : "Seekord ei võitnud 💨"),
        e("button", { className: "contbtn", onClick: next },
          betsDone >= TOTAL_BETS ? "Vaata lõpptulemust 🏁" : "Järgmine panus ➡")) : null);
  }

  /* ---------- overlayd ---------- */

  let ovl = null;
  if (overlay && overlay.kind === "gameover") {
    const score = Math.round(winnings);
    ovl = e("div", { className: "ovl" },
      e("div", { className: "bigico" }, "💣"),
      e("h2", null, "Mäng läbi!"),
      e("p", { style: { fontSize: 13, color: "var(--inkSoft)" } }, TOTAL_BETS + " panust tehtud. Sinu võidud kokku:"),
      e("div", { className: "winAmt" }, fmt(winnings)),
      e("p", { style: { fontSize: 13, color: "var(--inkSoft)" } },
        "Suurim võidetud pott: " + fmt(bestPot) +
        (winnings > 0 && sb ? " · kirjuta nimi ja salvesta edetabelisse" : "")),
      winnings > 0 && sb ? e("input", {
        className: "name-input", maxLength: 20, placeholder: "Sinu nimi",
        value: nameVal, onChange: ev => setNameVal(ev.target.value)
      }) : null,
      winnings > 0 && sb ? e("button", {
        className: "neonbtn",
        onClick: () => {
          AudioEngine.playSfx("click");
          // Sulge kohe — salvestus käib taustal, tulemus tuleb toastina
          newSession();
          setBoardOpen(true);
          submitScore(score).then(ok => {
            showToast(ok ? "🏆 Tulemus salvestatud!" : "Salvestamine ebaõnnestus — server ei vasta", ok ? 2200 : 3200);
            if (ok) loadBoard();
          });
        }
      }, "Salvesta ja uus mäng 🏆") : null,
      e("button", { className: winnings > 0 ? "neonbtn ghost" : "neonbtn", onClick: newSession },
        winnings > 0 ? "Uus mäng ilma salvestamata" : "Uus mäng 💣"));
  }

  const boardOvl = boardOpen ? e("div", { className: "ovl", onClick: ev => { if (ev.target === ev.currentTarget) setBoardOpen(false); } },
    e("div", { className: "panel" },
      e("h2", { style: { marginBottom: 14 } }, "🏆 Edetabel"),
      boardErr ? e("div", null,
        e("div", { className: "db-error" }, "Laadimine ebaõnnestus: " + boardErr),
        e("div", { style: { textAlign: "center", marginTop: 10 } },
          e("button", { className: "neonbtn ghost", onClick: () => loadBoard() }, "Proovi uuesti 🔄"))) :
        boardRows == null ? e("div", { className: "board-empty" }, "Laen…") :
          boardRows.length === 0 ? e("div", { className: "board-empty" }, "Ole esimene edetabelis! Mängi 10 panust läbi ja salvesta tulemus.") :
            boardRows.map((r, i) => e("div", { className: "board-row", key: i },
              e("span", { className: "board-rank" }, i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1) + "."),
              e("span", { className: "board-name" }, r.name),
              e("span", { className: "board-amt" }, fmt(+r.score)))),
      e("div", { style: { textAlign: "center", marginTop: 14 } },
        e("button", { className: "neonbtn ghost", onClick: () => setBoardOpen(false) }, "Sulge")))) : null;

  return e(React.Fragment, null,
    e("div", { className: "wrap" },
      e("div", { className: "topbar" },
        e("a", { className: "back", href: "/" }, "← AVALEHT"),
        e("div", { className: "iconbtns" },
          e("button", { className: "icobtn", onClick: () => { AudioEngine.playSfx("click"); setBoardOpen(true); }, title: "Edetabel" }, "🏆"),
          e("button", {
            className: "icobtn" + (sfxOn ? "" : " off"),
            onClick: () => { const v = !sfxOn; setSfxOnState(v); AudioEngine.setSfx(v); AudioEngine.playSfx("click"); }, title: "Heliefektid"
          }, "🔊"))),
      e("div", { className: "hdr" },
        e("h1", null, "Bomb Pot 💣"),
        e("p", null, "pokkeri all-in simulaator")),

      e("div", { className: "statrow" },
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Pank"),
          e("div", { className: "val" }, fmt(stake))),
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Võidud"),
          e("div", { className: "val winval" }, fmt(winnings))),
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Panuseid alles"),
          e("div", { className: "val betsval" }, (TOTAL_BETS - betsDone) + "/" + TOTAL_BETS))),

      main,

      !deal ? e("p", { className: "capnote" },
        "Mängid " + START_STAKE + " läbi: täpselt " + TOTAL_BETS + " all-in panust à " + BET + ". ",
        "Kõik võidud kogunevad eraldi potti ja lõppsumma läheb edetabelisse. ",
        "Mänguraha, päris raha siin ei liigu.") : null),

    toast ? e("div", { className: "toast" }, toast) : null,
    ovl, boardOvl);
}

ReactDOM.createRoot(document.getElementById("app")).render(e(App));
</script>
</body>
</html>
