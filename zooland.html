<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Zooland — beebibet</title>
<meta name="description" content="Zooland — džungliteemaline slotimäng. Mänguraha, tumble'id ja Vikerkaare Papagoi pommikordajad!" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg0:#0b2a12; --bg1:#0d3a17; --bg2:#072310;
    --panel:rgba(16,52,24,.6);
    --banana:#ffd54f; --jungle:#66bb6a; --sunset:#ff9052;
    --wood:#7a4f2a; --wood2:#5a3a1e;
    --ink:#f3f9ec; --inkSoft:#a9c9a0;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 45%,var(--bg2) 100%);
    font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2 { font-family:'Fraunces',serif; font-weight:600; }

  /* ---------- Džunglitaust ---------- */
  #fireflies { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .ray {
    position:fixed; top:-20%; width:130px; height:75%; z-index:0; pointer-events:none;
    background:linear-gradient(180deg,rgba(255,213,79,.16),rgba(255,213,79,0) 80%);
    filter:blur(14px); transform-origin:top center;
    animation:rayPulse 9s ease-in-out infinite;
  }
  .ray1 { left:12%; transform:rotate(14deg); }
  .ray2 { left:58%; transform:rotate(-10deg); animation-delay:-4.5s; }
  @keyframes rayPulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  .leaf {
    position:fixed; z-index:1; pointer-events:none; background:#06200c; opacity:.75;
    border-radius:0 62% 0 62%; transform-origin:bottom left;
    animation:leafSway 7s ease-in-out infinite;
  }
  .leaf.lt { border-radius:62% 0 62% 0; transform-origin:bottom right; }
  @keyframes leafSway { 0%,100%{transform:rotate(var(--r)) } 50%{transform:rotate(calc(var(--r) + 5deg))} }

  .wrap { max-width:480px; margin:0 auto; padding:0 12px 40px; position:relative; z-index:2; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 2px 4px; }
  .back { font-size:12px; font-weight:800; color:var(--inkSoft); text-decoration:none; letter-spacing:1px; }
  .iconbtns { display:flex; gap:6px; }
  .icobtn {
    width:36px; height:36px; border-radius:12px; border:1px solid rgba(140,200,120,.3);
    background:rgba(16,52,24,.7); color:var(--ink); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:transform .12s;
  }
  .icobtn:active { transform:scale(.92); }
  .icobtn.off { opacity:.35; }
  .icobtn.turbo-on { border-color:var(--banana); box-shadow:0 0 12px rgba(255,213,79,.45); }

  .hdr { text-align:center; padding:2px 0 10px; }
  .hdr h1 {
    font-size:36px; letter-spacing:-1px;
    background:linear-gradient(90deg,var(--banana),#aee571 55%,var(--sunset));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,213,79,.3));
  }
  .hdr p { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--inkSoft); font-weight:800; margin-top:2px; }

  .fsbanner {
    display:flex; align-items:center; justify-content:center; gap:12px;
    background:linear-gradient(90deg,rgba(255,213,79,.18),rgba(255,144,82,.18));
    border:1px solid rgba(255,213,79,.5); border-radius:14px;
    padding:8px 12px; margin-bottom:8px; font-size:13px; font-weight:800;
    box-shadow:0 0 18px rgba(255,213,79,.2);
  }
  .fsbanner b { color:var(--banana); font-size:15px; }

  /* ---------- Bambusraam + ruudustik ---------- */
  .board-outer {
    position:relative; border-radius:22px; padding:9px;
    background:linear-gradient(160deg,#8a5c32,var(--wood) 40%,var(--wood2));
    border:2px solid #9c6b3a;
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,230,170,.25), inset 0 -3px 0 rgba(0,0,0,.35);
  }
  .board-outer::before {
    content:""; position:absolute; inset:3px; border-radius:18px; pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 3px,transparent 3px 26px);
  }
  .board {
    position:relative; width:100%; aspect-ratio:6/5; overflow:hidden; border-radius:14px;
    background:linear-gradient(180deg,#0d3517,#0a2c12);
  }
  .cellbg { position:absolute; width:16.6667%; height:20%; }
  .cellbg::after { content:""; position:absolute; inset:2px; border-radius:9px; background:rgba(6,26,11,.55); border:1px solid rgba(140,200,120,.09); }

  .tile {
    position:absolute; width:16.6667%; height:20%; z-index:4;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(24px,8.6vw,42px); user-select:none; pointer-events:none;
    transition-property:top; transition-timing-function:cubic-bezier(.45,.02,.6,1.2);
  }
  /* Võidutabamus: vedruga "pop" ~1.25x, sära, hoia — alles seejärel purske */
  .tile.win {
    animation:winHit .42s cubic-bezier(.3,1.9,.4,1) forwards, winGlow 1s ease-in-out .42s infinite;
    z-index:6;
  }
  @keyframes winHit {
    0%   { transform:scale(1); filter:brightness(1); }
    55%  { transform:scale(1.45); filter:brightness(1.9) drop-shadow(0 0 22px rgba(255,240,180,1)); }
    100% { transform:scale(1.25); filter:brightness(1.5) drop-shadow(0 0 14px rgba(255,240,180,.9)); }
  }
  @keyframes winGlow {
    0%,100% { transform:scale(1.25); filter:brightness(1.5) drop-shadow(0 0 14px rgba(255,240,180,.9)); }
    50%     { transform:scale(1.32); filter:brightness(1.75) drop-shadow(0 0 20px rgba(255,240,180,1)); }
  }
  .board.hold .tile:not(.win):not(.die) { opacity:.45; filter:brightness(.65) saturate(.7); transition:opacity .25s,filter .25s; }
  .tile.die { animation:dieAnim .3s ease-in forwards; z-index:6; }
  @keyframes dieAnim { 0%{transform:scale(1.28);opacity:1} 100%{transform:scale(0);opacity:0} }
  .board.turbo .tile.win { animation-duration:.2s,.5s; animation-delay:0s,.2s; }
  .board.turbo .tile.die { animation-duration:.13s; }

  .tile.scat { filter:drop-shadow(0 0 12px var(--banana)); animation:scatFloat 2.4s ease-in-out infinite; }
  @keyframes scatFloat { 0%,100%{transform:scale(1) rotate(-5deg)} 50%{transform:scale(1.12) rotate(5deg)} }

  /* Vikerkaare Papagoi pomm */
  .tile.bomb { z-index:5; }
  .tile.bomb .bombdisc {
    position:absolute; inset:7%; border-radius:50%;
    background:conic-gradient(#ff5252,#ffb142,#ffe14d,#66e06a,#43c9ff,#b06aff,#ff5cc8,#ff5252);
    filter:blur(1px) saturate(1.4); opacity:.9;
    animation:bombSpin 3.2s linear infinite, bombThrob 1.4s ease-in-out infinite;
    box-shadow:0 0 16px rgba(255,120,220,.8), 0 0 30px rgba(120,200,255,.5);
  }
  @keyframes bombSpin { to { transform:rotate(360deg); } }
  @keyframes bombThrob { 0%,100%{opacity:.85} 50%{opacity:1} }
  .tile.bomb .bico { position:relative; z-index:2; font-size:.82em; filter:drop-shadow(0 1px 3px rgba(0,0,0,.7)); }
  .tile.bomb .bval {
    position:absolute; bottom:4%; left:50%; transform:translateX(-50%); z-index:3;
    font-size:clamp(10px,3.2vw,15px); font-weight:900; color:#fff;
    background:rgba(20,8,30,.85); border:1px solid rgba(255,255,255,.5);
    border-radius:999px; padding:0 6px; text-shadow:0 0 6px rgba(255,120,220,.9);
  }
  .tile.bomb.deton .bombdisc { animation:detonFlash .5s ease-in-out infinite; }
  @keyframes detonFlash { 0%,100%{filter:blur(1px) saturate(1.4) brightness(1)} 50%{filter:blur(0) saturate(2.2) brightness(1.9)} }

  .flyer {
    position:absolute; z-index:20; pointer-events:none;
    font-size:15px; font-weight:900; color:#fff;
    background:rgba(30,10,40,.92); border:1px solid #ff5cc8; border-radius:999px; padding:3px 10px;
    text-shadow:0 0 8px rgba(255,120,220,1); box-shadow:0 0 14px rgba(255,120,220,.7);
    transition:left .7s cubic-bezier(.5,-.2,.6,1), top .7s cubic-bezier(.5,-.2,.6,1), opacity .7s;
    transform:translate(-50%,-50%);
  }

  .particle {
    position:absolute; width:7px; height:7px; border-radius:50%; z-index:8; pointer-events:none;
    animation:partFly .6s ease-out forwards;
  }
  .particle.leafp {
    width:auto; height:auto; border-radius:0; background:none !important; box-shadow:none !important;
    font-size:14px; animation:leafFly .8s ease-out forwards;
  }
  @keyframes partFly {
    0% { transform:translate(0,0) scale(1); opacity:1; }
    100% { transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; }
  }
  @keyframes leafFly {
    0% { transform:translate(0,0) rotate(0deg); opacity:1; }
    100% { transform:translate(var(--dx),var(--dy)) rotate(240deg); opacity:0; }
  }

  .statrow { display:flex; gap:8px; margin-top:10px; }
  .stat {
    flex:1; background:var(--panel); border:1px solid rgba(140,200,120,.25); border-radius:14px;
    padding:8px 6px; text-align:center;
  }
  .stat .lbl { font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:var(--inkSoft); font-weight:800; }
  .stat .val { font-size:14px; font-weight:900; margin-top:1px; }
  .stat .val.winval { color:var(--banana); text-shadow:0 0 10px rgba(255,213,79,.5); }

  .controls { display:flex; align-items:center; gap:10px; margin-top:12px; }
  .betbox { display:flex; align-items:center; gap:4px; }
  .stepbtn {
    width:42px; height:42px; border-radius:14px; border:1px solid rgba(140,200,120,.35);
    background:rgba(20,60,28,.8); color:var(--ink); font-size:20px; font-weight:900; cursor:pointer;
  }
  .stepbtn:disabled { opacity:.3; }
  .betval { min-width:56px; text-align:center; font-size:15px; font-weight:900; color:var(--jungle); }
  .spinbtn {
    flex:1; height:62px; border-radius:20px; border:none; cursor:pointer;
    font-family:'Nunito',sans-serif; font-size:19px; font-weight:900; letter-spacing:1px; color:#2b1c05;
    background:linear-gradient(135deg,var(--banana),#ffb340);
    box-shadow:0 8px 26px rgba(255,213,79,.35), inset 0 -3px 0 rgba(0,0,0,.2);
    transition:transform .12s, filter .2s;
  }
  .spinbtn:active { transform:scale(.96); }
  .spinbtn:disabled { filter:grayscale(.7) brightness(.6); }

  .subrow { display:flex; gap:8px; margin-top:8px; }
  .antebtn {
    flex:1; padding:11px 8px; border-radius:16px; cursor:pointer;
    border:1px solid rgba(140,200,120,.35); background:rgba(20,60,28,.6); color:var(--inkSoft);
    font-family:'Nunito',sans-serif; font-size:12.5px; font-weight:900; transition:all .15s;
  }
  .antebtn.on {
    color:#2b1c05; background:linear-gradient(135deg,#aee571,var(--jungle));
    border-color:#aee571; box-shadow:0 0 14px rgba(174,229,113,.4);
  }
  .antebtn:disabled { opacity:.35; cursor:default; }
  .buybtn {
    flex:1; padding:11px 8px; border-radius:16px; cursor:pointer;
    border:1px solid rgba(255,144,82,.55); background:rgba(70,32,12,.6); color:var(--sunset);
    font-family:'Nunito',sans-serif; font-size:12.5px; font-weight:900;
    box-shadow:0 0 14px rgba(255,144,82,.15);
  }
  .buybtn:disabled { opacity:.35; box-shadow:none; cursor:default; }

  .ovl {
    position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
    background:rgba(4,16,7,.93); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    animation:ovlIn .25s ease-out;
  }
  @keyframes ovlIn { from{opacity:0} to{opacity:1} }
  .ovl h2 { font-size:30px; }
  .ovl .bigico { font-size:64px; animation:scatFloat 2.4s ease-in-out infinite; }
  .ovl .bigico.chest { animation:chestBeat .55s ease-in-out infinite; }
  @keyframes chestBeat {
    0%,100% { transform:scale(1) rotate(0deg); }
    25% { transform:scale(1.22) rotate(-7deg); }
    50% { transform:scale(1) rotate(0deg); }
    75% { transform:scale(1.22) rotate(7deg); }
  }
  .junglebtn {
    padding:15px 36px; border-radius:999px; border:none; cursor:pointer;
    font-family:'Nunito',sans-serif; font-size:17px; font-weight:900; color:#2b1c05;
    background:linear-gradient(135deg,var(--banana),#ffb340);
    box-shadow:0 8px 26px rgba(255,213,79,.4); transition:transform .12s;
  }
  .junglebtn:active { transform:scale(.95); }
  .junglebtn.green { background:linear-gradient(135deg,#aee571,var(--jungle)); box-shadow:0 8px 26px rgba(174,229,113,.4); }
  .junglebtn.ghost { background:transparent; color:var(--inkSoft); box-shadow:none; border:1px solid rgba(140,200,120,.35); }

  .winTitle {
    font-family:'Fraunces',serif; font-size:44px; font-weight:600; line-height:1.1;
    background:linear-gradient(90deg,var(--banana),#fff6d8,var(--banana));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,213,79,.6));
    animation:winTitleIn .5s cubic-bezier(.2,2,.4,1);
  }
  .winTitle.rainbow { background:linear-gradient(90deg,#ff5cc8,var(--banana),#aee571,#43c9ff); -webkit-background-clip:text; background-clip:text; }
  @keyframes winTitleIn { 0%{transform:scale(.2)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .winAmt { font-size:36px; font-weight:900; color:var(--banana); text-shadow:0 0 18px rgba(255,213,79,.7); }

  .toast {
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:80;
    background:rgba(16,52,24,.96); border:1px solid var(--banana); color:var(--ink);
    padding:10px 22px; border-radius:999px; font-weight:900; font-size:14px;
    box-shadow:0 0 22px rgba(255,213,79,.4); animation:ovlIn .2s ease-out; white-space:nowrap;
  }

  .panel {
    width:100%; max-width:400px; background:rgba(10,40,18,.97);
    border:1px solid rgba(140,200,120,.35); border-radius:22px; padding:22px;
    max-height:80vh; overflow-y:auto;
  }
  .board-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; margin-bottom:6px; background:rgba(24,70,34,.55); }
  .board-rank { font-size:16px; min-width:26px; }
  .board-name { flex:1; font-weight:700; font-size:14px; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .board-mult { font-weight:900; font-size:14px; color:var(--banana); }
  .board-amt { font-size:11px; color:var(--inkSoft); min-width:52px; text-align:right; }
  .board-empty { color:var(--inkSoft); font-size:13px; padding:14px 0; }
  .db-error { background:rgba(110,30,20,.4); border:1px solid rgba(255,110,80,.5); border-radius:12px; padding:10px; font-size:11px; color:#ffb09a; margin-top:8px; word-break:break-all; }

  .name-input {
    width:220px; padding:13px 16px; border-radius:14px; border:1px solid rgba(140,200,120,.45);
    font-size:16px; font-family:'Nunito',sans-serif; font-weight:800; color:var(--ink);
    background:rgba(8,30,14,.85); text-align:center;
  }
  .name-input:focus { outline:none; border-color:var(--banana); box-shadow:0 0 12px rgba(255,213,79,.3); }

  .capnote { font-size:11px; color:var(--inkSoft); text-align:center; margin-top:10px; line-height:1.5; }
</style>
</head>

<script>
"use strict";
/* ============================================================
   Supabase
   ============================================================ */
const SUPABASE_URL = "https://thrsacygpqwbnkcppmpk.supabase.co";
const SUPABASE_KEY = "sb_publishable_-QaY7mGpitakhestu3w1fg_sCGquRvx";

try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (err) { console.error("Supabase init:", err); }

/* ============================================================
   Taust: lehesiluetid + jaanimardikad
   ============================================================ */
(function jungleDeco() {
  const host = document.getElementById("leaves");
  const defs = [
    [-30, -40, 190, 150, -25, 0], [70, -50, 220, 170, 30, 1],
    [-50, 30, 170, 130, -60, 0], [78, 40, 200, 150, 55, 1],
    [-35, 72, 190, 140, -35, 0], [72, 78, 210, 160, 40, 1]
  ];
  defs.forEach(([x, y, w, h, r, left], i) => {
    const d = document.createElement("div");
    d.className = "leaf" + (left ? " lt" : "");
    d.style.cssText = `left:${x}%;top:${y}%;width:${w}px;height:${h}px;--r:${r}deg;animation-delay:${-i * 1.3}s;animation-duration:${6.5 + i}s`;
    host.appendChild(d);
  });

  const cv = document.getElementById("fireflies");
  const cx = cv.getContext("2d");
  let flies = [];
  function resize() {
    cv.width = innerWidth; cv.height = innerHeight;
    flies = Array.from({ length: 22 }, () => ({
      x: Math.random() * cv.width, y: Math.random() * cv.height,
      a: Math.random() * Math.PI * 2, s: .12 + Math.random() * .25,
      p: Math.random() * Math.PI * 2, tw: .4 + Math.random() * 1.1
    }));
  }
  resize(); addEventListener("resize", resize);
  (function loop(t) {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (const f of flies) {
      f.a += (Math.random() - .5) * .1;
      f.x += Math.cos(f.a) * f.s; f.y += Math.sin(f.a) * f.s * .7;
      if (f.x < -10) f.x = cv.width + 10; if (f.x > cv.width + 10) f.x = -10;
      if (f.y < -10) f.y = cv.height + 10; if (f.y > cv.height + 10) f.y = -10;
      const glow = .25 + .75 * Math.abs(Math.sin(t / 1000 * f.tw + f.p));
      cx.globalAlpha = glow * .8;
      cx.fillStyle = "#ffe680";
      cx.shadowColor = "#ffe680"; cx.shadowBlur = 8;
      cx.beginPath(); cx.arc(f.x, f.y, 1.7, 0, 7); cx.fill();
      cx.shadowBlur = 0;
    }
    requestAnimationFrame(loop);
  })(0);
})();

/* ============================================================
   Helimootor (Web Audio, failideta — džunglitunne)
   ============================================================ */
const AudioEngine = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null, delaySend = null;
  let musicOn = localStorage.getItem("zooland_music") !== "0";
  let sfxOn = localStorage.getItem("zooland_sfx") !== "0";
  let musicStarted = false, bonusMode = false;
  let noiseBuf = null;
  const timers = [];

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = musicOn ? .32 : 0; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = sfxOn ? .75 : 0; sfxBus.connect(master);
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }

  function getNoise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  // Müravälgatus (trummid, sahinad, plahvatused)
  function burst(opts) {
    const t = ctx.currentTime + (opts.delay || 0);
    const src = ctx.createBufferSource(); src.buffer = getNoise(); src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = opts.ftype || "bandpass"; f.frequency.setValueAtTime(opts.freq || 1200, t);
    if (opts.fslide) f.frequency.exponentialRampToValueAtTime(opts.fslide, t + opts.dur);
    f.Q.value = opts.q != null ? opts.q : 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(opts.vol != null ? opts.vol : .2, t + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + opts.dur);
    src.connect(f); f.connect(g); g.connect(opts.bus || sfxBus);
    src.start(t); src.stop(t + opts.dur + .05);
  }

  function tone(freq, dur, opts) {
    opts = opts || {};
    const t = ctx.currentTime + (opts.delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = opts.type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t + dur * (opts.slideT || 1));
    if (opts.slide2) o.frequency.exponentialRampToValueAtTime(opts.slide2, t + dur);

const e = React.createElement;

if (localStorage.getItem("zooland_saldover") !== String(START_SALDO)) {

}

let tileSeq = 1;

function App() {
  // Sessioonimudel (nagu KosmosBetis): mängid START_SALDO läbi — panused

  const [saldo, setSaldo] = useState(() => lsNum("zooland_saldo", START_SALDO));

  const [musicOn, setMusicOnState] = useState(AudioEngine.musicOn);
  const [sfxOn, setSfxOnState] = useState(AudioEngine.sfxOn);
  const [tiles, setTiles] = useState([]);        // {id, sym, mult, col, row, y, phase, delay}
  const [particles, setParticles] = useState([]);
  const [flyers, setFlyers] = useState([]);      // pommikordajate lendajad
  const [holding, setHolding] = useState(false); // võidupausi dim-efekt
  const [detonating, setDetonating] = useState(false);
  const [fs, setFs] = useState(null);            // {remaining, win}
  const [overlay, setOverlay] = useState(null);

  const [boardOpen, setBoardOpen] = useState(false);

  const [nameVal, setNameVal] = useState(() => localStorage.getItem("zooland_name") || "");

  const rngRef = useRef(M.makeRng(M.randomSeed()));

  const saldoRef = useRef(saldo); saldoRef.current = saldo;
  const resultRef = useRef(result); resultRef.current = result;
  const spinningRef = useRef(false);

  const winCounterRef = useRef(null);
  const nameValRef = useRef(nameVal); nameValRef.current = nameVal;

  // Rahulik avavaade: juhuslik ruudustik enne esimest keerutust
  useEffect(() => {
    const g = M.generateGrid(rngRef.current, 0, false);

  }
  async function timedOverlay(o, ms) {

  function countUpWin(from, to, dur) {
    clearInterval(winCounterRef.current);
    const steps = Math.max(1, Math.round(dur / 40));

    winCounterRef.current = setInterval(() => {
      i++;
      setWinDisplay(from + (to - from) * (i / steps));
      if (i >= steps) clearInterval(winCounterRef.current);
    }, 40);
  }

  /* ---------- ruudustiku animatsioonid ---------- */

  function buildTiles(grid, bombMult, dropIn) {
    const arr = [];
    for (let c = 0; c < M.CELLS; c++) {
      const row = (c / M.COLS) | 0, col = c % M.COLS;
      arr.push({
        id: tileSeq++, sym: grid[c], mult: bombMult ? bombMult[c] : 0, col, row,
        y: dropIn ? row - 7 : row, phase: "idle",
        delay: dropIn ? col * 45 : 0

    }
    return arr;
  }

  async function animateDrop(grid, bombMult) {
    setTiles(buildTiles(grid, bombMult, true));
    await sleep(30);
    setTiles(ts => ts.map(t => ({ ...t, y: t.row })));
    for (let i = 0; i < 4; i++) setTimeout(() => AudioEngine.playSfx("tick"), T(110) * (i + 1));
    await sleep(T(420) + M.COLS * 45 / (turboRef.current ? 3 : 1));
  }

  function spawnParticles(cells, color) {
    const ps = [];
    for (const c of cells) {
      const row = (c / M.COLS) | 0, col = c % M.COLS;
      for (let i = 0; i < 4; i++) {
        const ang = Math.random() * Math.PI * 2, dist = 26 + Math.random() * 48;
        ps.push({
          id: tileSeq++, x: (col + .5) * CW, y: (row + .5) * CH,
          dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist, color, kind: "dot"
        });
      }
      // lehed + konfetti tunne
      for (let i = 0; i < 2; i++) {
        const ang = -Math.PI / 2 + (Math.random() - .5) * 2;
        ps.push({
          id: tileSeq++, x: (col + .5) * CW, y: (row + .5) * CH,
          dx: Math.cos(ang) * (20 + Math.random() * 40), dy: 30 + Math.random() * 40, kind: "leaf"

  // Mängib ühe keerutuse tulemuse sammhaaval maha.
  // Tagastab kuvatud võidusumma (winSoFar + selle keerutuse võit).
  async function animateSpin(res, bet, winSoFar) {
    await animateDrop(res.initialGrid, res.initialBombs);
    if (res.scatterCount > 0) AudioEngine.playSfx("scatter");
    if (res.initialBombs.some(m => m > 0)) AudioEngine.playSfx("bombLand");

    let acc = winSoFar || 0;
    let tileGrid = null;
    setTiles(ts => { tileGrid = ts.slice().sort((a, b) => (a.row * M.COLS + a.col) - (b.row * M.COLS + b.col)); return ts; });
    await sleep(20);

    for (const step of res.steps) {
      const winCells = new Set();
      let maxLvl = 0;
      for (const w of step.wins) {
        w.cells.forEach(c => winCells.add(c));
        maxLvl = Math.max(maxLvl, Math.floor(Math.log2(w.pay + 1)) + (w.count >= 12 ? 2 : 0));
      }

      // 1) hetkeline paus — las pilk jõuab kohale
      await sleep(T(160));

      // 2) võidusümbolite vedrupop + sära; teised tuhmuvad; SFX popi hetkel
      setHolding(true);
      setTiles(ts => ts.map(t => winCells.has(t.row * M.COLS + t.col) && t.phase === "idle" ? { ...t, phase: "win" } : t));
      AudioEngine.playSfx("win", maxLvl);
      countUpWin(acc, acc + step.stepWin, HOLD());
      acc += step.stepWin;

      // 3) hoia suurendatud olekut — mängija registreerib tabamuse
      await sleep(HOLD());
      setHolding(false);

      // 4) purse: lehed + konfetti, sümbolid kaovad
      for (const w of step.wins) spawnParticles(w.cells, M.SYMBOLS[w.sym].color);
      setTiles(ts => ts.map(t => winCells.has(t.row * M.COLS + t.col) ? { ...t, phase: "die" } : t));
      await sleep(T(300));

      // 5) tumble: ellujäänud kukuvad, uued tulevad ülevalt
      const survivors = [];
      const newTiles = [];
      for (let col = 0; col < M.COLS; col++) {
        let write = M.ROWS - 1;
        for (let row = M.ROWS - 1; row >= 0; row--) {
          const c = row * M.COLS + col;
          if (!step.removed[c]) {
            const t = tileGrid[c];
            survivors.push({ ...t, row: write, y: write, phase: "idle", delay: 0 });
            write--;
          }
        }
        const removedCount = write + 1;
        for (let row = removedCount - 1; row >= 0; row--) {
          const c = row * M.COLS + col;
          newTiles.push({
            id: tileSeq++, sym: step.gridAfter[c], mult: step.bombAfter[c], col, row,
            y: row - removedCount - 1, phase: "idle", delay: 0
          });
        }
      }
      const all = [...survivors, ...newTiles];
      setTiles(all);
      await sleep(30);
      setTiles(ts => ts.map(t => ({ ...t, y: t.row })));
      AudioEngine.playSfx("tick");
      if (step.newBombCells.length) setTimeout(() => AudioEngine.playSfx("bombLand"), T(220));
      await sleep(T(400));

      tileGrid = new Array(M.CELLS);
      for (const t of all) tileGrid[t.row * M.COLS + t.col] = { ...t, y: t.row };
    }

    // Pommide detonatsioon: võiduahela lõpus korrutame kordajate summaga
    if (res.bombApplied) {
      setDetonating(true);
      AudioEngine.playSfx("bombBoom");
      const fls = res.bombCells.map(b => ({
        id: tileSeq++, mult: b.mult,
        x: (b.cell % M.COLS + .5) * CW, y: (((b.cell / M.COLS) | 0) + .5) * CH
      }));
      setFlyers(fls);
      await sleep(60);
      setFlyers(f => f.map(x => ({ ...x, x: 50, y: 118, fade: true })));

    // Scatteri otsemakse
    if (res.scatterPay > 0) {
      countUpWin(acc, acc + res.scatterPay, T(500));
      acc += res.scatterPay;

    setBoardErr(null); setBoardRows(null);
    try {
      const { data, error } = await withTimeout(sb.from("zooland_leaderboard")
        .select("name,win_amount,win_multiplier")
        .order("win_multiplier", { ascending: false })
        .limit(10), 15000);
      if (error) throw new Error(error.message + (error.code ? " (" + error.code + ")" : ""));
      setBoardRows(data || []);
    } catch (err) {
      if (attempt < 2) return loadBoard(attempt + 1);
      setBoardErr(err.message);
    }
  }
  useEffect(() => { if (boardOpen && sb) loadBoard(); }, [boardOpen]);

  /* ---------- keerutus ---------- */

  async function doSpin(buy) {
    if (spinningRef.current) return;
    const bet = BETS[betIdx];
    const cost = buy ? 100 * bet : ante ? +(1.25 * bet).toFixed(2) : bet;
    if (saldoRef.current < cost - 1e-9) {
      if (saldoRef.current < BETS[0] - 1e-9) setOverlay({ kind: "gameover", amt: resultRef.current });
      else showToast("Saldo ei kata panust — vähenda panust!");
      return;
    }

    spinningRef.current = true; setSpinning(true);
    setSaldo(s => +(s - cost).toFixed(2));
    setLastWin(0); setWinDisplay(0);
    AudioEngine.playSfx("spin");

    const rng = rngRef.current;
    const bet0 = bet;
    const cap = M.MAX_WIN_X * bet0;
    const spinRes = M.playSpin(rng, bet0, {
      freeSpin: false,
      ante: !buy && ante,
      forcedScatters: buy ? M.drawBuyScatters(rng) : null,
      capRemaining: cap
    });

    await animateSpin(spinRes, bet0, 0);
    let roundWin = spinRes.win;

    if (!spinRes.capped && spinRes.scatterCount >= 4) {
      roundWin = await runBonus(spinRes.scatterCount, bet0, spinRes.win, rng);
    } else {
      setLastWin(spinRes.win); setWinDisplay(spinRes.win);
      await celebrate(spinRes.win, bet0, spinRes.capped);
    }

    // Võit läheb tulemusse, mitte tagasi saldosse
    const finalResult = +(resultRef.current + roundWin).toFixed(2);
    if (roundWin > 0) setResult(finalResult);

    spinningRef.current = false; setSpinning(false);
    if (saldoRef.current < BETS[0] - 1e-9) {
      await sleep(400);
      setOverlay({ kind: "gameover", amt: finalResult });
    }
  }

  async function runBonus(scatters, bet, baseWin, rng) {
    AudioEngine.playSfx("bonus");
    await waitOverlay({ kind: "bonusIntro", spins: M.FS_START, scatters });
    AudioEngine.setBonusMode(true);

    const cap = M.MAX_WIN_X * bet;
    let remaining = M.FS_START, total = baseWin, fsWin = baseWin, capped = false;
    setFs({ remaining, win: fsWin });

    while (remaining > 0 && total < cap) {
      remaining--;
      setFs({ remaining, win: fsWin });
      AudioEngine.playSfx("spin");
      const r = M.playSpin(rng, bet, { freeSpin: true, capRemaining: cap - total });
      await animateSpin(r, bet, fsWin);
      fsWin += r.win; total += r.win;
      setFs({ remaining, win: fsWin });
      setWinDisplay(fsWin);
      if (r.capped) { capped = true; break; }
      if (r.scatterCount >= 3) {
        remaining += M.FS_RETRIGGER;
        AudioEngine.playSfx("bonus");
        showToast("🍌 +" + M.FS_RETRIGGER + " keerutust!");
        setFs({ remaining, win: fsWin });
        await sleep(T(900));
      }
      await sleep(T(280));
    }

    AudioEngine.setBonusMode(false);
    setFs(null);
    setLastWin(total); setWinDisplay(total);
    AudioEngine.playSfx("bigwin");
    await waitOverlay({ kind: "bonusEnd", amt: total, capped });
    await celebrate(total, bet, capped);
    return total;
  }

  function newSession() {
    AudioEngine.playSfx("click");
    setSaldo(START_SALDO); setResult(0); setLastWin(0); setWinDisplay(0);
    setOverlay(null);
  }

  /* ---------- render ---------- */

  const bet = BETS[betIdx];
  const buyCost = 100 * bet;
  const buyAllowed = betIdx <= MAX_BUY_BET_IDX && !ante;
  const dropSecs = turbo ? .13 : .38;

  const cellBgs = [];
  for (let c = 0; c < M.CELLS; c++) {
    cellBgs.push(e("div", {
      key: "bg" + c, className: "cellbg",
      style: { left: (c % M.COLS) * CW + "%", top: ((c / M.COLS) | 0) * CH + "%" }
    }));
  }

  const tileEls = tiles.map(t => {
    const isBomb = t.sym === M.BOMB;
    const cls = "tile"
      + (t.phase === "win" ? " win" : t.phase === "die" ? " die" : "")
      + (t.sym === M.SCATTER ? " scat" : "")
      + (isBomb ? " bomb" + (detonating ? " deton" : "") : "");
    return e("div", {
      key: t.id, className: cls,
      style: {
        left: t.col * CW + "%", top: t.y * CH + "%",
        transitionDuration: dropSecs + "s", transitionDelay: (t.delay || 0) + "ms"
      }
    },
      isBomb ? e("div", { className: "bombdisc" }) : null,
      isBomb ? e("span", { className: "bico" }, "🦜") : M.SYMBOLS[t.sym].emoji,
      isBomb ? e("span", { className: "bval" }, "×" + t.mult) : null);
  });

  const particleEls = particles.map(p => p.kind === "leaf"
    ? e("div", {
        key: p.id, className: "particle leafp",
        style: { left: p.x + "%", top: p.y + "%", "--dx": p.dx + "px", "--dy": p.dy + "px" }
      }, Math.random() < .5 ? "🍃" : "🍂")
    : e("div", {
        key: p.id, className: "particle",
        style: { left: p.x + "%", top: p.y + "%", background: p.color, "--dx": p.dx + "px", "--dy": p.dy + "px", boxShadow: "0 0 6px " + p.color }
      }));

  const flyerEls = flyers.map(f => e("div", {
    key: f.id, className: "flyer",
    style: { left: f.x + "%", top: f.y + "%", opacity: f.fade ? 0 : 1 }
  }, "×" + f.mult));

  let ovl = null;
  if (overlay) {
    if (overlay.kind === "bonusIntro") {
      ovl = e("div", { className: "ovl" },
        e("div", { className: "bigico" }, "🍌"),
        e("h2", { style: { color: "var(--banana)" } }, "TASUTA KEERUTUSED!"),
        e("p", { style: { fontSize: 15 } }, overlay.scatters + " Kuldset Banaani = ", e("b", { style: { color: "var(--banana)" } }, overlay.spins + " tasuta keerutust")),
        e("p", { style: { fontSize: 12, color: "var(--inkSoft)", lineHeight: 1.5 } },
          "Vikerkaare Papagoi pommid maanduvad kordajatega kuni ×100 — võiduahela lõpus liidetakse kõik ekraanil olevad kordajad ja võit korrutatakse summaga!"),
        e("button", { className: "junglebtn", onClick: () => { AudioEngine.playSfx("click"); resolveOverlay(); } }, "Alusta 🐒"));
    } else if (overlay.kind === "bonusEnd") {
      ovl = e("div", { className: "ovl" },
        e("div", { className: "bigico" }, overlay.capped ? "👑" : "🏆"),
        e("h2", null, "Boonus läbi!"),
        e("div", { className: "winAmt" }, fmt(overlay.amt)),
        e("p", { style: { fontSize: 13, color: "var(--inkSoft)" } }, fmtX(overlay.amt / bet) + " panusest"),
        e("button", { className: "junglebtn", onClick: () => { AudioEngine.playSfx("click"); resolveOverlay(); } }, "Jätka"));
    } else if (overlay.kind === "bigwin") {
      ovl = e("div", { className: "ovl", onClick: resolveOverlay },
        e("div", { className: "bigico" + (overlay.chest ? " chest" : "") }, overlay.ico),
        e("div", { className: "winTitle " + overlay.cls }, overlay.title),
        e("div", { className: "winAmt" }, fmt(overlay.amt)));
    } else if (overlay.kind === "gameover") {
      const mult = overlay.amt / START_SALDO;
      ovl = e("div", { className: "ovl" },
        e("div", { className: "bigico" }, "🦁"),
        e("h2", null, "Toit otsas — mäng läbi!"),
        e("p", { style: { fontSize: 13, color: "var(--inkSoft)" } }, START_SALDO + " saldot mängitud. Sinu tulemus:"),
        e("div", { className: "winAmt" }, fmt(overlay.amt)),
        e("p", { style: { fontSize: 13, color: "var(--inkSoft)" } }, fmtX(mult) + " · kirjuta nimi ja salvesta edetabelisse"),
        overlay.amt > 0 && sb ? e("input", {
          className: "name-input", maxLength: 20, placeholder: "Sinu nimi",
          value: nameVal, onChange: ev => setNameVal(ev.target.value)
        }) : null,
        overlay.amt > 0 && sb ? e("button", {
          className: "junglebtn green",
          onClick: () => {
            AudioEngine.playSfx("click");
            const amt = overlay.amt;
            // Sulge kohe — salvestus käib taustal, tulemus tuleb toastina
            newSession();
            setBoardOpen(true);
            submitScore(amt, amt / START_SALDO).then(ok => {
              showToast(ok ? "🏆 Tulemus salvestatud!" : "Salvestamine ebaõnnestus — server ei vasta", ok ? 2200 : 3200);
              if (ok) loadBoard();
            });
          }
        }, "Salvesta ja uus mäng 🏆") : null,
        e("button", { className: overlay.amt > 0 ? "junglebtn ghost" : "junglebtn", onClick: newSession },
          overlay.amt > 0 ? "Uus mäng ilma salvestamata" : "Uus mäng — toida loomi 🍌"));
    }
  }

  const boardOvl = boardOpen ? e("div", { className: "ovl", onClick: ev => { if (ev.target === ev.currentTarget) setBoardOpen(false); } },
    e("div", { className: "panel" },
      e("h2", { style: { marginBottom: 14 } }, "🏆 Edetabel"),
      boardErr ? e("div", null,
        e("div", { className: "db-error" }, "Laadimine ebaõnnestus: " + boardErr),
        e("div", { style: { textAlign: "center", marginTop: 10 } },
          e("button", { className: "junglebtn ghost", onClick: () => loadBoard() }, "Proovi uuesti 🔄"))) :
        boardRows == null ? e("div", { className: "board-empty" }, "Laen…") :
          boardRows.length === 0 ? e("div", { className: "board-empty" }, "Ole esimene edetabelis! Mängi oma " + START_SALDO + " saldot läbi ja salvesta tulemus.") :
            boardRows.map((r, i) => e("div", { className: "board-row", key: i },
              e("span", { className: "board-rank" }, i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1) + "."),
              e("span", { className: "board-name" }, r.name),
              e("span", { className: "board-mult" }, fmtX(+r.win_multiplier)),
              e("span", { className: "board-amt" }, fmt(+r.win_amount)))),
      e("div", { style: { textAlign: "center", marginTop: 14 } },
        e("button", { className: "junglebtn ghost", onClick: () => setBoardOpen(false) }, "Sulge")))) : null;

  return e(React.Fragment, null,
    e("div", { className: "wrap" },
      e("div", { className: "topbar" },
        e("a", { className: "back", href: "/" }, "← AVALEHT"),
        e("div", { className: "iconbtns" },
          e("button", { className: "icobtn", onClick: () => { AudioEngine.playSfx("click"); setBoardOpen(true); }, title: "Edetabel" }, "🏆"),
          e("button", {
            className: "icobtn" + (musicOn ? "" : " off"),
            onClick: () => { const v = !musicOn; setMusicOnState(v); AudioEngine.setMusic(v); }, title: "Muusika"
          }, "🎵"),
          e("button", {
            className: "icobtn" + (sfxOn ? "" : " off"),
            onClick: () => { const v = !sfxOn; setSfxOnState(v); AudioEngine.setSfx(v); AudioEngine.playSfx("click"); }, title: "Heliefektid"
          }, "🔊"),
          e("button", {
            className: "icobtn" + (turbo ? " turbo-on" : ""),
            onClick: () => { AudioEngine.playSfx("click"); setTurbo(t => !t); }, title: "Turbo"
          }, "⚡"))),
      e("div", { className: "hdr" },
        e("h1", null, "Zooland"),
        e("p", null, "džungli slotimäng")),

      fs ? e("div", { className: "fsbanner" },
        e("span", null, "🍌 Tasuta keerutused: ", e("b", null, fs.remaining)),
        e("span", null, "Võit: ", e("b", null, fmt(fs.win || 0)))) : null,

      e("div", { className: "board-outer" },
        e("div", { className: "board" + (turbo ? " turbo" : "") + (holding ? " hold" : "") },
          cellBgs, tileEls, particleEls),
        flyerEls),

      e("div", { className: "statrow" },
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Saldo"),
          e("div", { className: "val" }, fmt(saldo))),
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Panus"),
          e("div", { className: "val", style: { color: "var(--jungle)" } }, fmt(ante ? +(bet * 1.25).toFixed(2) : bet))),
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Võit"),
          e("div", { className: "val winval" }, fmt(winDisplay))),
        e("div", { className: "stat" },
          e("div", { className: "lbl" }, "Tulemus"),
          e("div", { className: "val", style: { color: "var(--sunset)" } }, fmt(result)))),

      e("div", { className: "controls" },
        e("div", { className: "betbox" },
          e("button", {
            className: "stepbtn", disabled: spinning || betIdx === 0,
            onClick: () => { AudioEngine.playSfx("click"); setBetIdx(i => Math.max(0, i - 1)); }
          }, "−"),
          e("div", { className: "betval" }, fmt(bet)),
          e("button", {
            className: "stepbtn", disabled: spinning || betIdx === BETS.length - 1,
            onClick: () => { AudioEngine.playSfx("click"); setBetIdx(i => Math.min(BETS.length - 1, i + 1)); }
          }, "+")),
        e("button", { className: "spinbtn", disabled: spinning, onClick: () => doSpin(false) },
          spinning ? "..." : "KEERUTA 🍌")),

      e("div", { className: "subrow" },
        e("button", {
          className: "antebtn" + (ante ? " on" : ""), disabled: spinning,
          onClick: () => { AudioEngine.playSfx("click"); setAnte(a => !a); },
          title: "Panus maksab 1.25x, kuldsete banaanide maandumise tõenäosus kahekordistub"
        }, "🍌🍌 Topelt banaanid" + (ante ? " ✓" : "")),
        e("button", {
          className: "buybtn", disabled: spinning || !buyAllowed,
          onClick: () => doSpin(true),
          title: ante ? "Lülita Topelt banaanid välja" : betIdx > MAX_BUY_BET_IDX ? "Boonusost lubatud vaid panustel 0.2, 0.4 ja 1.0" : ""
        }, betIdx <= MAX_BUY_BET_IDX ? "🎁 OSTA BOONUS — " + fmt(buyCost) : "🎁 OSTA BOONUS (max 1.00)")),

      e("p", { className: "capnote" },
        "Mängid " + START_SALDO + " saldot läbi — panused tulevad saldost, kõik võidud kogunevad tulemuseks ja tulemus läheb edetabelisse. ",
        "Mänguraha, päris raha siin ei liigu. 8+ sama sümbolit ükskõik kus võidab. Max võit " + M.MAX_WIN_X + "x panus.")),

    toast ? e("div", { className: "toast" }, toast) : null,
    ovl, boardOvl);
}

ReactDOM.createRoot(document.getElementById("app")).render(e(App));
</script>
</body>
</html>
