# Hoiab tasuta Supabase projekti ärkvel: free tier paneb projekti ~7 päeva
# jõudeoleku järel pausile, mis lülitab kõigi mängude edetabelid välja.
# See workflow "puudutab" REST API-t iga 3 päeva tagant, nii et projekt
# püsib aktiivne kuude kaupa (100+ päeva) ilma käsitsi äratamiseta.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # Avalik (publishable) võti — sama, mis on niikuinii mängude HTML-is
          KEY="sb_publishable_-QaY7mGpitakhestu3w1fg_sCGquRvx"
          code=$(curl -sS -m 30 -o /tmp/resp.json -w "%{http_code}" \
            "https://thrsacygpqwbnkcppmpk.supabase.co/rest/v1/kosmos_leaderboard?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ei vastanud 200-ga — projekt võib olla pausil. Ärata see dashboardist: https://supabase.com/dashboard/project/thrsacygpqwbnkcppmpk"
            exit 1
          fi
