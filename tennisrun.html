<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Tennis Run — beebibet</title>
<meta name="description" content="Tennis Run — tennise crash-mäng mängurahaga. Servi ässasid, roni kordajaredelil ja korja võit välja enne tagasilööki!" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg0:#071022; --bg1:#0a1a38; --bg2:#050b18;
    --panel:rgba(12,28,56,.65);
    --courtblue:#2f6fc2; --courtblue2:#265ea8; --courtgreen:#3e7c46; --courtgreen2:#356b3d;
    --line:#eef4ff; --ball:#d8f34a; --gold:#ffd54f; --hot:#ff5c6c; --ok:#5be16f;
    --ink:#eef4ff; --inkSoft:#93a7cc;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 45%,var(--bg2) 100%);
    font-family:'Nunito',sans-serif; color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2 { font-family:'Fraunces',serif; font-weight:600; }

  .wrap { max-width:480px; margin:0 auto; padding:0 12px 40px; position:relative; z-index:2; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 2px 4px; }
  .back { font-size:12px; font-weight:800; color:var(--inkSoft); text-decoration:none; letter-spacing:1px; }
  .iconbtns { display:flex; gap:6px; }
  .icobtn {
    width:36px; height:36px; border-radius:12px; border:1px solid rgba(120,160,220,.3);
    background:rgba(12,28,56,.7); color:var(--ink); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:transform .12s;
  }
  .icobtn:active { transform:scale(.92); }
  .icobtn.off { opacity:.35; }

  .hdr { text-align:center; padding:2px 0 6px; }
  .hdr h1 {
    font-size:30px; letter-spacing:-1px;
    background:linear-gradient(90deg,var(--ball),#8fe0ff 55%,var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(216,243,74,.3));
  }
  .hdr p { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--inkSoft); font-weight:800; margin-top:2px; }

  /* ---------- Kordajaredel ---------- */
  .ladder {
    display:flex; gap:6px; overflow-x:auto; padding:6px 2px 8px; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .ladder::-webkit-scrollbar { display:none; }
  .rung {
    flex:0 0 auto; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:900;
    border:1px solid rgba(120,160,220,.25); background:rgba(12,28,56,.6); color:var(--inkSoft);
    white-space:nowrap;
  }
  .rung.done { background:linear-gradient(135deg,#2f7a3a,#1f5c2a); border-color:var(--ok); color:#d7ffdc; }
  .rung.next {
    background:linear-gradient(135deg,var(--gold),#ffb340); border-color:#ffe9a8; color:#33230a;
    animation:rungPulse 1.1s ease-in-out infinite;
  }
  @keyframes rungPulse { 0%,100%{transform:scale(1); box-shadow:0 0 0 rgba(255,213,79,0)} 50%{transform:scale(1.07); box-shadow:0 0 14px rgba(255,213,79,.5)} }
  .ladderbar { height:5px; border-radius:999px; background:rgba(120,160,220,.18); margin:0 2px 6px; overflow:hidden; }
  .ladderbar > div { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--ok),var(--ball)); transition:width .4s; }

  /* ---------- Valikute ajalugu ---------- */
  .hist { display:flex; gap:5px; overflow-x:auto; padding:0 2px 8px; min-height:26px; scrollbar-width:none; }
  .hist::-webkit-scrollbar { display:none; }
  .histchip {
    flex:0 0 auto; width:26px; height:22px; border-radius:8px; font-size:12px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    background:rgba(46,120,60,.55); border:1px solid rgba(91,225,111,.5); color:#d7ffdc;
  }
  .histchip.bad { background:rgba(120,30,36,.6); border-color:rgba(255,92,108,.6); color:#ffd0d5; }

  /* ---------- Staadion + väljak ---------- */
  .stadium {
    position:relative; border-radius:22px; padding:10px 10px 12px; overflow:hidden;
    background:linear-gradient(180deg,#0d1c3a,#122a52 30%,#0d1c3a);
    border:2px solid rgba(120,160,220,.3);
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 2px 0 rgba(160,200,255,.15);
  }
  .crowd {
    height:20px; border-radius:12px 12px 0 0; margin-bottom:5px; opacity:.9;
    background:
      radial-gradient(circle 3px at 10px 8px, #ffd7a8 55%, transparent 60%),
      radial-gradient(circle 3px at 26px 14px, #f0b48a 55%, transparent 60%),
      radial-gradient(circle 3px at 42px 6px, #d9a06b 55%, transparent 60%),
      radial-gradient(circle 3px at 58px 15px, #ffd7a8 55%, transparent 60%),
      radial-gradient(circle 3px at 74px 9px, #c98d5f 55%, transparent 60%),
      radial-gradient(circle 3px at 90px 16px, #f0c9a0 55%, transparent 60%),
      linear-gradient(180deg,#1b2f57,#152546);
    background-size:96px 24px,96px 24px,96px 24px,96px 24px,96px 24px,96px 24px,100% 100%;
  }
  .floodlight {
    position:absolute; top:-8%; width:150px; height:65%; pointer-events:none; z-index:1;
    background:linear-gradient(180deg,rgba(216,243,74,.10),rgba(216,243,74,0) 80%);
    filter:blur(10px);
  }
  .court {
    position:relative; width:100%; aspect-ratio:10/9; border-radius:12px; overflow:hidden;
    background:linear-gradient(180deg,var(--courtgreen) 0%,var(--courtgreen2) 100%);
  }
  .incourt {
    position:absolute; left:9%; right:9%; top:6%; bottom:6%;
    background:linear-gradient(180deg,var(--courtblue),var(--courtblue2));
    border:3px solid var(--line); box-shadow:0 0 22px rgba(0,0,0,.25) inset;
  }
  .cline { position:absolute; background:var(--line); opacity:.95; }
  .svcbox {
    position:absolute; transition:background .25s, box-shadow .25s;
  }
  .svcbox.hitok { background:rgba(91,225,111,.4); box-shadow:0 0 26px rgba(91,225,111,.7) inset; }
  .svcbox.hitbad { background:rgba(255,92,108,.42); box-shadow:0 0 26px rgba(255,92,108,.75) inset; }
  .netband {
    position:absolute; left:4%; right:4%; top:50%; height:9px; transform:translateY(-50%); z-index:5;
    background:repeating-linear-gradient(90deg,rgba(240,246,255,.85) 0 2px,rgba(20,40,70,.25) 2px 6px);
    border-top:3px solid #fff; border-bottom:1px solid rgba(255,255,255,.4); border-radius:2px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .netpost { position:absolute; top:50%; width:7px; height:16px; transform:translateY(-56%); background:#c9d6ea; border-radius:3px; z-index:5; }

  .defender {
    position:absolute; left:50%; top:11.5%; z-index:6; width:clamp(34px,11vw,50px);
    transform:translateX(-50%); transition:transform .45s cubic-bezier(.3,1.4,.5,1);
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));
  }
  .defender.diveL { transform:translateX(-50%) translateX(-170%) rotate(-55deg); }
  .defender.diveR { transform:translateX(-50%) translateX(170%) rotate(55deg) scaleX(-1); }
  .server {
    position:absolute; left:50%; bottom:1.5%; z-index:6; width:clamp(42px,13.5vw,60px);
    transform:translateX(-50%); filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));
  }
  .server svg, .defender svg { width:100%; height:auto; display:block; }
  .server.tossing { animation:tossAnim .5s ease-out; }
  @keyframes tossAnim { 0%{transform:translateX(-50%) rotate(0)} 40%{transform:translateX(-50%) rotate(-14deg) translateY(-6px)} 100%{transform:translateX(-50%) rotate(0)} }

  .wintag {
    position:absolute; left:50%; bottom:16%; transform:translateX(-50%); z-index:7;
    background:linear-gradient(135deg,var(--gold),#ffb340); color:#33230a;
    font-size:14px; font-weight:900; padding:4px 12px; border-radius:999px;
    border:2px solid #fff3cf; box-shadow:0 4px 14px rgba(255,213,79,.45);
    animation:tagBob 1.6s ease-in-out infinite; white-space:nowrap;
  }
  .wintag::after {
    content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%);
    border:5px solid transparent; border-top-color:#ffb340;
  }
  @keyframes tagBob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-5px)} }

  .ball {
    position:absolute; z-index:8; font-size:clamp(15px,4.6vw,21px); pointer-events:none;
    transform:translate(-50%,-50%);
    transition:left .55s cubic-bezier(.35,.1,.45,1), top .55s cubic-bezier(.3,-.35,.5,1);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
  }
  .ball.spin { animation:ballSpin .5s linear infinite; }
  @keyframes ballSpin { to { transform:translate(-50%,-50%) rotate(360deg); } }
  .ball.slowmo { transition-duration:1.15s; transition-timing-function:linear,linear; }

  .courtflash {
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); z-index:10;
    font-family:'Fraunces',serif; font-size:clamp(30px,11vw,48px); font-weight:600; letter-spacing:1px;
    pointer-events:none; animation:flashIn .5s cubic-bezier(.2,2,.4,1);
    text-shadow:0 4px 18px rgba(0,0,0,.6);
  }
  .courtflash.ace { color:var(--ball); filter:drop-shadow(0 0 18px rgba(216,243,74,.8)); }
  .courtflash.fail { color:var(--hot); filter:drop-shadow(0 0 18px rgba(255,92,108,.8)); }
  @keyframes flashIn { 0%{transform:translate(-50%,-50%) scale(.2)} 70%{transform:translate(-50%,-50%) scale(1.15)} 100%{transform:translate(-50%,-50%) scale(1)} }

  .cd {
    position:absolute; left:50%; top:56%; transform:translateX(-50%); z-index:9;
    background:rgba(6,14,30,.8); border:1px solid rgba(216,243,74,.5); color:var(--ball);
    font-size:12.5px; font-weight:900; padding:5px 14px; border-radius:999px; white-space:nowrap;
  }
  .cd b { font-size:15px; }
  .cd.urgent { border-color:var(--hot); color:#ffb0b8; animation:rungPulse .55s ease-in-out infinite; }

  /* ---------- Statistika + juhtimine ---------- */
  .statrow { display:flex; gap:8px; margin-top:8px; }
  .stat {
    flex:1; background:var(--panel); border:1px solid rgba(120,160,220,.25); border-radius:14px;
    padding:7px 5px; text-align:center;
  }
  .stat .lbl { font-size:9px; letter-spacing:1.2px; text-transform:uppercase; color:var(--inkSoft); font-weight:800; }
  .stat .val { font-size:14px; font-weight:900; margin-top:1px; }
  .stat .val.winval { color:var(--gold); text-shadow:0 0 10px rgba(255,213,79,.5); }

  .betpanel {
    background:var(--panel); border:1px solid rgba(120,160,220,.25); border-radius:20px;
    padding:14px; margin-top:10px;
  }
  .betlbl { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--inkSoft); font-weight:800; margin:10px 2px 6px; }
  .betlbl:first-child { margin-top:0; }
  .diffgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .diffcard {
    padding:10px 11px; border-radius:16px; cursor:pointer; text-align:left;
    border:1px solid rgba(120,160,220,.3); background:rgba(16,36,70,.6); color:var(--ink);
    font-family:'Nunito',sans-serif; transition:all .15s;
  }
  .diffcard.on {
    border-color:var(--ball); background:rgba(30,54,96,.9);
    box-shadow:0 0 14px rgba(216,243,74,.35);
  }
  .diffcard .dname { font-weight:900; font-size:14px; }
  .diffcard .dmult { font-size:12px; font-weight:900; color:var(--gold); margin-top:2px; }
  .diffcard .dmeta { font-size:10.5px; color:var(--inkSoft); margin-top:3px; line-height:1.35; }
  .chips {
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:0 0 auto; min-width:62px; padding:12px 10px; border-radius:14px; cursor:pointer;
    border:1px solid rgba(120,160,220,.35); background:rgba(16,36,70,.7); color:var(--ink);
    font-family:'Nunito',sans-serif; font-size:14px; font-weight:900; transition:all .15s;
  }
  .chip.on { background:linear-gradient(135deg,var(--ball),#9fd93c); color:#1d2a06; border-color:#eaffb0; box-shadow:0 0 14px rgba(216,243,74,.4); }
  .chip:disabled { opacity:.35; }

  .bigbtn {
    width:100%; margin-top:10px; height:60px; border-radius:20px; border:none; cursor:pointer;
    font-family:'Nunito',sans-serif; font-size:18px; font-weight:900; letter-spacing:1px; color:#1d2a06;
    background:linear-gradient(135deg,var(--ball),#9fd93c);
    box-shadow:0 8px 26px rgba(216,243,74,.3), inset 0 -3px 0 rgba(0,0,0,.2);
    transition:transform .12s, filter .2s;
  }
  .bigbtn:active { transform:scale(.97); }
  .bigbtn:disabled { filter:grayscale(.7) brightness(.6); }

  .serverow { display:flex; gap:8px; margin-top:10px; }
  .servebtn {
    flex:1; height:62px; border-radius:20px; border:none; cursor:pointer;
    font-family:'Nunito',sans-serif; font-size:14.5px; font-weight:900; line-height:1.25; color:#fff;
    background:linear-gradient(160deg,#3c78cf,#2a5aa4);
    border:1px solid rgba(160,200,255,.4);
    box-shadow:0 8px 22px rgba(47,111,194,.35), inset 0 -3px 0 rgba(0,0,0,.25);
    transition:transform .12s, filter .2s;
  }
  .servebtn:active { transform:scale(.95); }
  .servebtn:disabled { filter:grayscale(.6) brightness(.55); }
  .servebtn.rand {
    flex:0 0 74px; font-size:26px;
    background:linear-gradient(160deg,#7a4fd0,#5a35a8); border-color:rgba(200,170,255,.45);
    box-shadow:0 8px 22px rgba(122,79,208,.35), inset 0 -3px 0 rgba(0,0,0,.25);
  }
  .collectbtn {
    width:100%; margin-top:8px; height:50px; border-radius:18px; border:none; cursor:pointer;
    font-family:'Nunito',sans-serif; font-size:16.5px; font-weight:900; letter-spacing:.5px; color:#33230a;
    background:linear-gradient(135deg,var(--gold),#ffb340);
    box-shadow:0 8px 24px rgba(255,213,79,.4), inset 0 -3px 0 rgba(0,0,0,.2);
    transition:transform .12s, filter .2s;
  }
  .collectbtn:active { transform:scale(.97); }
  .collectbtn:disabled { filter:grayscale(.75) brightness(.55); }

  /* ---------- Kihlvedude ekraanid ---------- */
  .ovl {
    position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
    background:rgba(4,9,20,.93); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    animation:ovlIn .25s ease-out;
  }
  @keyframes ovlIn { from{opacity:0} to{opacity:1} }
  .ovl h2 { font-size:30px; }
  .ovl .bigico { font-size:64px; animation:icoFloat 2.4s ease-in-out infinite; }
  @keyframes icoFloat { 0%,100%{transform:scale(1) rotate(-4deg)} 50%{transform:scale(1.1) rotate(4deg)} }
  .winTitle {
    font-family:'Fraunces',serif; font-size:44px; font-weight:600; line-height:1.1;
    background:linear-gradient(90deg,var(--gold),#fff6d8,var(--ball));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,213,79,.6));
    animation:winTitleIn .5s cubic-bezier(.2,2,.4,1);
  }
  @keyframes winTitleIn { 0%{transform:scale(.2)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .winAmt { font-size:36px; font-weight:900; color:var(--gold); text-shadow:0 0 18px rgba(255,213,79,.7); }
  .ovlnote { font-size:13px; color:var(--inkSoft); line-height:1.5; max-width:320px; }
  .courtbtn {
    padding:15px 34px; border-radius:999px; border:none; cursor:pointer;
    font-family:'Nunito',sans-serif; font-size:16px; font-weight:900; color:#1d2a06;
    background:linear-gradient(135deg,var(--ball),#9fd93c);
    box-shadow:0 8px 26px rgba(216,243,74,.35); transition:transform .12s;
  }
  .courtbtn:active { transform:scale(.95); }
  .courtbtn.gold { background:linear-gradient(135deg,var(--gold),#ffb340); color:#33230a; box-shadow:0 8px 26px rgba(255,213,79,.4); }
  .courtbtn.ghost { background:transparent; color:var(--inkSoft); box-shadow:none; border:1px solid rgba(120,160,220,.35); }
  .btnrow { display:flex; gap:10px; }

  .name-input {
    width:230px; padding:13px 16px; border-radius:14px; border:1px solid rgba(120,160,220,.45);
    font-size:16px; font-family:'Nunito',sans-serif; font-weight:800; color:var(--ink);
    background:rgba(8,20,42,.85); text-align:center;
  }
  .name-input:focus { outline:none; border-color:var(--ball); box-shadow:0 0 12px rgba(216,243,74,.3); }

  /* ---------- Edetabel ---------- */
  .panel {
    width:100%; max-width:400px; background:rgba(8,20,42,.97);
    border:1px solid rgba(120,160,220,.35); border-radius:22px; padding:22px;
    max-height:80vh; overflow-y:auto;
  }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab {
    flex:1; padding:9px 6px; border-radius:12px; cursor:pointer; font-family:'Nunito',sans-serif;
    font-size:12.5px; font-weight:900; color:var(--inkSoft);
    background:rgba(16,36,70,.6); border:1px solid rgba(120,160,220,.3);
  }
  .tab.on { color:#1d2a06; background:linear-gradient(135deg,var(--ball),#9fd93c); border-color:#eaffb0; }
  .board-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; margin-bottom:6px; background:rgba(18,42,82,.6); }
  .board-rank { font-size:16px; min-width:26px; }
  .board-name { flex:1; font-weight:700; font-size:14px; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .board-rally { font-weight:900; font-size:14px; color:var(--ball); white-space:nowrap; }
  .board-rally small { color:var(--ok); font-size:11px; font-weight:900; }
  .board-amt { font-size:12px; color:var(--gold); min-width:52px; text-align:right; font-weight:800; }
  .board-empty { color:var(--inkSoft); font-size:13px; padding:14px 0; }
  .db-error { background:rgba(110,30,20,.4); border:1px solid rgba(255,110,80,.5); border-radius:12px; padding:10px; font-size:11px; color:#ffb09a; margin-top:8px; word-break:break-all; }

  .toast {
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:80;
    background:rgba(8,20,42,.96); border:1px solid var(--ball); color:var(--ink);
    padding:10px 22px; border-radius:999px; font-weight:900; font-size:14px;
    box-shadow:0 0 22px rgba(216,243,74,.4); animation:ovlIn .2s ease-out; white-space:nowrap;
  }

  .conf {
    position:fixed; top:-20px; z-index:70; pointer-events:none; border-radius:2px;
    animation:confFall linear forwards;
  }
  @keyframes confFall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }
    100% { transform:translateY(110vh) rotate(var(--rr)); opacity:.75; }
  }

  .capnote { font-size:11px; color:var(--inkSoft); text-align:center; margin-top:12px; line-height:1.5; }

  /* Lühikesed ekraanid (rakendusesisene brauser): mahuta servinupud kindlalt vaatevälja */
  @media (max-height:720px) {
    .crowd { display:none; }
    .court { aspect-ratio:10/8.2; }
    .topbar { padding-top:8px; }
    .ladder { padding:4px 2px 6px; }
    .servebtn { height:56px; }
    .collectbtn { height:46px; }
    .hist { padding-bottom:5px; min-height:22px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";
/* ============================================================
   Supabase — sama projekt nagu teistel beebibet mängudel
   ============================================================ */
const SUPABASE_URL = "https://thrsacygpqwbnkcppmpk.supabase.co";
const SUPABASE_KEY = "sb_publishable_-QaY7mGpitakhestu3w1fg_sCGquRvx";
let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (err) { console.error("Supabase init:", err); }

/* ============================================================
   Mängu häälestus — RTP on siit timmitav
   ============================================================ */
const RTP = 0.96;                // esimese astme väljamakse osakaal (~96% RTP)
const CASHOUT_BONUS = 3;         // väljakorjamise boonusringid edetabelis
const AUTO_PICK_SECONDS = 5;     // automaatvaliku loendur
const BETS = [0.2, 0.5, 1, 2, 5, 10, 20, 50, 100];
const MIN_BET = 0.1;
const START_SALDO = 100;
const LADDER_MIN_RUNGS = 12;

// Raskusastmed: p = ässa tõenäosus ringi kohta. Kaitsja pool on alati salajane
// 50/50; kui p > 0.5, lööb kaitsja vahel ka õigelt poolelt auti, kui p < 0.5,
// jõuab välkkiire kaitsja vahel ka vabale poolele. Redel: esimene aste
// RTP/p, iga järgmine kordistub 1/p — nii püsib RTP igal astmel sama.
const DIFFS = [
  { id: "kerge",    nimi: "Kerge",    emoji: "🐣", p: 0.70, desc: "Kohmakas kaitsja lööb tihti auti" },
  { id: "keskmine", nimi: "Keskmine", emoji: "🎾", p: 0.50, desc: "Aus 50/50 duell" },
  { id: "raske",    nimi: "Raske",    emoji: "🔥", p: 0.35, desc: "Kiire kaitsja katab vahel mõlemad pooled" },
  { id: "meister",  nimi: "Meister",  emoji: "👑", p: 0.25, desc: "Grand Slami finaal — hiigelkordajad" }
];
const DIFF_BY_ID = {};
DIFFS.forEach(d => { DIFF_BY_ID[d.id] = d; });

const ladderMult = (diff, n) => (RTP / diff.p) * Math.pow(1 / diff.p, n - 1);
const fmt = n => n.toFixed(2);
const fmtX = n => "×" + (n >= 1000 ? Math.round(n).toLocaleString("et") : n.toFixed(2));

function secureSide() {
  try {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return (a[0] & 1) === 0 ? "L" : "R";
  } catch (err) { return Math.random() < .5 ? "L" : "R"; }
}
function secureFloat() {
  try {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] / 4294967296;
  } catch (err) { return Math.random(); }
}

function lsNum(key, def) { const v = parseFloat(localStorage.getItem(key)); return isNaN(v) ? def : v; }

/* ============================================================
   Helimootor (Web Audio, failideta) + summutusnupp
   ============================================================ */
const AudioEngine = (() => {
  let ctx = null, bus = null, noiseBuf = null;
  let on = localStorage.getItem("tennisrun_sound") !== "0";

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      bus = ctx.createGain(); bus.gain.value = on ? .8 : 0; bus.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }
  function getNoise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }
  function burst(opts) {
    const t = ctx.currentTime + (opts.delay || 0);
    const src = ctx.createBufferSource(); src.buffer = getNoise(); src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = opts.ftype || "bandpass"; f.frequency.setValueAtTime(opts.freq || 1200, t);
    if (opts.fslide) f.frequency.exponentialRampToValueAtTime(opts.fslide, t + opts.dur);
    f.Q.value = opts.q != null ? opts.q : 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(opts.vol != null ? opts.vol : .2, t + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + opts.dur);
    src.connect(f); f.connect(g); g.connect(bus);
    src.start(t); src.stop(t + opts.dur + .05);
  }
  function tone(freq, dur, opts) {
    opts = opts || {};
    const t = ctx.currentTime + (opts.delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = opts.type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(opts.vol != null ? opts.vol : .25, t + (opts.att || .012));
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + dur + .05);
  }
  function applause(vol, delay) {
    for (let i = 0; i < 10; i++)
      burst({ freq: 1400 + Math.random() * 1400, q: .7, dur: .1 + Math.random() * .12, vol: (vol || .06), delay: (delay || 0) + i * .05 });
  }
  function playSfx(name) {
    if (!on || !ensure()) return;
    switch (name) {
      case "click": tone(520, .06, { type: "sine", vol: .12 }); break;
      case "tick": tone(980, .05, { type: "square", vol: .05 }); tone(1600, .03, { type: "sine", vol: .04 }); break;
      case "serve": // reketi "pop"
        burst({ freq: 900, q: 1.2, dur: .09, vol: .3 });
        tone(220, .16, { type: "sine", slide: 90, vol: .22 });
        break;
      case "bounce": burst({ freq: 500, q: 1.5, dur: .06, vol: .18 }); break;
      case "ace": // tõusev duo + aplausisahin
        tone(660, .14, { type: "triangle", vol: .2 });
        tone(990, .2, { type: "triangle", vol: .2, delay: .1 });
        applause(.045, .12);
        break;
      case "fail": // langev saag + madal mats
        tone(300, .5, { type: "sawtooth", slide: 82, vol: .16 });
        tone(70, .45, { type: "sine", slide: 42, vol: .38, delay: .22 });
        burst({ freq: 240, ftype: "lowpass", dur: .3, vol: .25, delay: .2 });
        break;
      case "cashout": // fanfaar + suur aplaus
        [523, 659, 784, 1047, 1319].forEach((f, i) => {
          tone(f, .32, { type: "triangle", vol: .2, delay: i * .1 });
          tone(f * 2, .18, { type: "sine", vol: .06, delay: i * .1 });
        });
        applause(.07, .35); applause(.05, .95);
        break;
    }
  }
  function setOn(v) {
    on = v; localStorage.setItem("tennisrun_sound", v ? "1" : "0");
    if (ensure() && bus) bus.gain.value = v ? .8 : 0;
  }
  return { playSfx, setOn, get on() { return on; } };
})();

function App() {
  const [saldo, setSaldo] = useState(() => lsNum("tennisrun_saldo", START_SALDO));
  const [bet, setBet] = useState(() => lsNum("tennisrun_bet", 0.5));
  const [diffId, setDiffId] = useState(() => DIFF_BY_ID[localStorage.getItem("tennisrun_diff")] ? localStorage.getItem("tennisrun_diff") : "keskmine");
  const [runDiff, setRunDiff] = useState(null); // jooksva runni raskusaste (külmutatakse stardil)
  const [phase, setPhase] = useState("bet");   // bet | pick | serve | lost | cashed
  const [rounds, setRounds] = useState(0);
  const [history, setHistory] = useState([]);
  const [countdown, setCountdown] = useState(AUTO_PICK_SECONDS);
  const [dive, setDive] = useState(null);      // null | "L" | "R"
  const [ball, setBall] = useState(null);      // {side, stage:"fly"|"back"}
  const [reveal, setReveal] = useState(null);  // {def, pick, ace}
  const [tossing, setTossing] = useState(false);
  const [lastWin, setLastWin] = useState(0);
  const [soundOn, setSoundOn] = useState(AudioEngine.on);
  const [overlay, setOverlay] = useState(null);
  const [toast, setToast] = useState(null);
  const [confetti, setConfetti] = useState([]);
  const [boardOpen, setBoardOpen] = useState(false);
  const [boardTab, setBoardTab] = useState("rally"); // rally | win
  const [boardRows, setBoardRows] = useState(null);
  const [boardErr, setBoardErr] = useState(null);
  const [nameVal, setNameVal] = useState(() => localStorage.getItem("tennisrun_name") || "");
  const [saveState, setSaveState] = useState(null); // null | "saving" | "saved" | "failed"

  const roundRef = useRef(null);         // ringi salajane loos {def, roll} — valitakse ENNE nuppude näitamist
  const runDiffRef = useRef(null);
  const phaseRef = useRef(phase); phaseRef.current = phase;
  const roundsRef = useRef(rounds); roundsRef.current = rounds;
  const betRef = useRef(bet); betRef.current = bet;
  const resolvingRef = useRef(false);
  const cdTimerRef = useRef(null);
  const pickRef = useRef(null);
  const ladderRef = useRef(null);
  const nameValRef = useRef(nameVal); nameValRef.current = nameVal;

  useEffect(() => { localStorage.setItem("tennisrun_saldo", String(saldo)); }, [saldo]);
  useEffect(() => { localStorage.setItem("tennisrun_bet", String(bet)); }, [bet]);
  useEffect(() => { localStorage.setItem("tennisrun_diff", diffId); }, [diffId]);
  useEffect(() => () => clearInterval(cdTimerRef.current), []);

  // Aktiivne redelipulk keritakse vaatevälja
  useEffect(() => {
    const host = ladderRef.current;
    if (!host) return;
    const idx = Math.max(0, rounds - 1);
    const el = host.children[idx];
    if (el) host.scrollTo({ left: el.offsetLeft - host.clientWidth / 2 + el.clientWidth / 2, behavior: "smooth" });
  }, [rounds, phase]);

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const winAmount = r => +(betRef.current * ladderMult(runDiffRef.current || DIFF_BY_ID.keskmine, r)).toFixed(2);

  function showToast(msg, dur) {
    setToast(msg);
    setTimeout(() => setToast(t => (t === msg ? null : t)), dur || 2000);
  }

  function spawnConfetti() {
    const colors = ["#d8f34a", "#ffd54f", "#5be16f", "#8fe0ff", "#ff8fb3", "#fff"];
    const ps = [];
    for (let i = 0; i < 90; i++) {
      ps.push({
        id: seq++, x: Math.random() * 100,
        w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
        color: colors[(Math.random() * colors.length) | 0],
        dur: 2.2 + Math.random() * 2.2, delay: Math.random() * .9,
        rot: (Math.random() * 720 - 360) + "deg"
      });
    }
    setConfetti(ps);
    setTimeout(() => setConfetti([]), 5200);
  }

  /* ---------- ringi elutsükkel ---------- */

  function startRound() {
    // Kaitsja pool + oskuse loos tehakse ENNE valikunuppude renderdamist ja hoitakse salajas
    roundRef.current = { def: secureSide(), roll: secureFloat() };
    setReveal(null); setDive(null); setBall(null);
    setPhase("pick");
    setCountdown(AUTO_PICK_SECONDS);
    clearInterval(cdTimerRef.current);
    cdTimerRef.current = setInterval(() => {
      setCountdown(c => {
        if (c <= 1) {
          clearInterval(cdTimerRef.current);
          setTimeout(() => { if (pickRef.current) pickRef.current(secureSide()); }, 0);
          return 0;
        }
        if (c <= 4) AudioEngine.playSfx("tick");
        return c - 1;
      });
    }, 1000);
  }

  function startRun() {
    if (phaseRef.current !== "bet" || resolvingRef.current) return;
    const b = betRef.current;
    if (!(b >= MIN_BET)) { showToast("Vali panus!"); return; }
    if (saldo < b - 1e-9) { showToast("Saldo ei kata panust!"); return; }
    AudioEngine.playSfx("click");
    const d = DIFF_BY_ID[diffId] || DIFF_BY_ID.keskmine;
    runDiffRef.current = d; setRunDiff(d);
    setSaldo(s => +(s - b).toFixed(2));
    setRounds(0); setHistory([]); setLastWin(0); setSaveState(null);
    startRound();
  }

  async function pick(side) {
    if (phaseRef.current !== "pick" || resolvingRef.current) return;
    resolvingRef.current = true;
    clearInterval(cdTimerRef.current);
    const { def, roll } = roundRef.current;
    const p = runDiffRef.current.p;
    // Tulemus raskusastme järgi: kohmakas kaitsja (p > .5) lööb vahel õigelt
    // poolelt auti; välkkiire (p < .5) jõuab vahel ka vabale poolele.
    let ace, kind, diveSide;
    if (side === def) {
      const flub = p > 0.5 ? (p - 0.5) / 0.5 : 0;
      ace = roll < flub;
      kind = ace ? "flub" : "return";
      diveSide = def;
    } else {
      const reach = p < 0.5 ? (0.5 - p) / 0.5 : 0;
      ace = roll >= reach;
      kind = ace ? "ace" : "reach";
      diveSide = ace ? def : side;
    }
    setPhase("serve");

    // Serv: viska pall üles ja löö
    setTossing(true);
    AudioEngine.playSfx("serve");
    setBall({ side, stage: "fly" });
    setTimeout(() => setTossing(false), 500);
    await sleep(150);
    setDive(diveSide);                  // kaitsja sööstab (või jõuab üllatuslikult kohale)
    await sleep(480);
    AudioEngine.playSfx("bounce");
    setReveal({ def, pick: side, ace, kind });

    if (ace) {
      AudioEngine.playSfx("ace");
      const r = roundsRef.current + 1;
      setRounds(r);
      setHistory(h => [...h, { id: seq++, side, ok: true }]);
      await sleep(850);
      resolvingRef.current = false;
      startRound();
    } else {
      AudioEngine.playSfx("fail");
      setHistory(h => [...h, { id: seq++, side, ok: false }]);
      await sleep(250);
      setBall({ side, stage: "back" });  // aeglustatud tagasilöök mööda servijast
      await sleep(1250);
      setPhase("lost");
      setOverlay({ kind: "lost", rounds: roundsRef.current, bet: betRef.current });
      resolvingRef.current = false;
    }
  }
  pickRef.current = pick;

  function cashOut() {
    if (phaseRef.current !== "pick" || roundsRef.current < 1 || resolvingRef.current) return;
    clearInterval(cdTimerRef.current);
    const amt = winAmount(roundsRef.current);
    setSaldo(s => +(s + amt).toFixed(2));
    setLastWin(amt);
    setPhase("cashed");
    AudioEngine.playSfx("cashout");
    spawnConfetti();
    setOverlay({ kind: "cashed", amt, rounds: roundsRef.current });
  }

  function backToBet() {
    AudioEngine.playSfx("click");
    clearInterval(cdTimerRef.current);
    setOverlay(null); setPhase("bet");
    setRounds(0); setHistory([]); setReveal(null); setDive(null); setBall(null);
    setSaveState(null);
  }

  /* ---------- edetabel ---------- */

  function withTimeout(p, ms) {
    return Promise.race([
      Promise.resolve(p),
      new Promise((_, rej) => setTimeout(() => rej(new Error("Ajalõpp — server ei vasta")), ms))
    ]);
  }

  async function submitScore(runRounds, cashedOut, amount) {
    const name = nameValRef.current.trim();
    if (!name || !sb) return false;
    localStorage.setItem("tennisrun_name", name);
    const payload = {
      name,
      rounds: runRounds,
      rally_score: runRounds + (cashedOut ? CASHOUT_BONUS : 0),
      cashed_out: cashedOut,
      win_amount: +amount.toFixed(2),
      difficulty: runDiffRef.current ? runDiffRef.current.id : "keskmine"
    };
    for (let attempt = 1; attempt <= 2; attempt++) {
      try {
        const { error } = await withTimeout(sb.from("tennisrun_leaderboard").insert(payload), 15000);
        if (error) throw error;
        return true;
      } catch (err) { console.error("Edetabeli salvestus (katse " + attempt + "):", err); }
    }
    return false;
  }

  async function loadBoard(tab, attempt) {
    attempt = attempt || 1;
    setBoardErr(null); setBoardRows(null);
    try {
      const orderCol = tab === "win" ? "win_amount" : "rally_score";
      const { data, error } = await withTimeout(sb.from("tennisrun_leaderboard")
        .select("name,rounds,rally_score,cashed_out,win_amount,difficulty,created_at")
        .order(orderCol, { ascending: false })
        .order("created_at", { ascending: true })
        .limit(10), 15000);
      if (error) throw new Error(error.message + (error.code ? " (" + error.code + ")" : ""));
      setBoardRows(data || []);
    } catch (err) {
      if (attempt < 2) return loadBoard(tab, attempt + 1);
      setBoardErr(err.message);
    }
  }
  useEffect(() => { if (boardOpen && sb) loadBoard(boardTab); }, [boardOpen, boardTab]);

  function saveRun(runRounds, cashedOut, amount) {
    if (!nameValRef.current.trim()) { showToast("Kirjuta enne oma nimi!"); return; }
    AudioEngine.playSfx("click");
    setSaveState("saving");
    submitScore(runRounds, cashedOut, amount).then(ok => {
      setSaveState(ok ? "saved" : "failed");
      showToast(ok ? "🏆 Tulemus salvestatud!" : "Salvestamine ebaõnnestus — proovi uuesti", ok ? 2200 : 3000);
    });
  }

  /* ---------- render ---------- */

  const inRun = phase === "pick" || phase === "serve";
  const selDiff = DIFF_BY_ID[diffId] || DIFF_BY_ID.keskmine;
  const activeDiff = phase === "bet" ? selDiff : (runDiff || selDiff);
  const curWin = rounds >= 1 ? winAmount(rounds) : 0;
  const nextWin = winAmount(rounds + 1);

  // Redel (aktiivse raskusastme kordajad)
  const rungCount = Math.max(LADDER_MIN_RUNGS, rounds + 6);
  const rungs = [];
  for (let i = 1; i <= rungCount; i++) {
    const cls = "rung" + (i <= rounds ? " done" : (inRun && i === rounds + 1 ? " next" : ""));
    rungs.push(e("div", { key: i, className: cls }, fmtX(ladderMult(activeDiff, i))));
  }
  const ladderPct = Math.min(100, rounds / rungCount * 100);

  // Ajalugu
  const histEls = history.map(h => e("div", {
    key: h.id, className: "histchip" + (h.ok ? "" : " bad")
  }, h.side === "L" ? "⬅" : "➡"));

  // Pall
  let ballStyle = null;
  if (ball) {
    if (ball.stage === "fly") {
      ballStyle = { left: ball.side === "L" ? "30%" : "70%", top: "26%" };
    } else {
      ballStyle = { left: ball.side === "L" ? "78%" : "22%", top: "108%" };
    }
  } else {
    ballStyle = { left: "53%", top: "88%" };
  }

  const flashText = reveal
    ? (reveal.kind === "flub" ? "AUTI!" : reveal.kind === "reach" ? "SUPERTÕRJE!" : reveal.ace ? "ÄSS!" : "TAGASILÖÖK!")
    : "";

  const court = e("div", { className: "stadium" },
    e("div", { className: "floodlight", style: { left: "6%", transform: "rotate(16deg)" } }),
    e("div", { className: "floodlight", style: { right: "6%", transform: "rotate(-16deg)" } }),
    e("div", { className: "crowd" }),
    e("div", { className: "court" },
      e("div", { className: "incourt" },
        // Servikastid kaitsja poolel + jooned
        e("div", { className: "cline", style: { left: 0, right: 0, top: "44%", height: 3 } }),          // servijoon
        e("div", { className: "cline", style: { left: "50%", top: 0, bottom: "56%", width: 3, transform: "translateX(-50%)" } }), // keskjoon
        e("div", {
          className: "svcbox" + (reveal ? (reveal.pick === "L" ? (reveal.ace ? " hitok" : " hitbad") : "") : ""),
          style: { left: 0, top: 0, width: "50%", height: "44%" }
        }),
        e("div", {
          className: "svcbox" + (reveal ? (reveal.pick === "R" ? (reveal.ace ? " hitok" : " hitbad") : "") : ""),
          style: { right: 0, top: 0, width: "50%", height: "44%" }
        }),
        e("div", { className: "cline", style: { left: 0, right: 0, bottom: "44%", height: 3, opacity: .35 } }),
        e("div", { className: "cline", style: { left: "50%", bottom: 0, top: "56%", width: 3, transform: "translateX(-50%)", opacity: .35 } })),
      e("div", { className: "netpost", style: { left: "2%" } }),
      e("div", { className: "netpost", style: { right: "2%" } }),
      e("div", { className: "netband" }),
      e("div", { className: "defender" + (dive === "L" ? " diveL" : dive === "R" ? " diveR" : "") }, playerEl("ready", "#ff7043")),
      e("div", { className: "server" + (tossing ? " tossing" : "") }, playerEl("serve", "#d8f34a")),
      inRun && rounds >= 1 ? e("div", { className: "wintag" }, "💰 " + fmt(curWin)) : null,
      inRun && rounds === 0 ? e("div", { className: "wintag", style: { filter: "saturate(.5)", opacity: .85 } }, "Panus " + fmt(bet)) : null,
      e("div", { className: "ball" + (ball && ball.stage === "fly" ? " spin" : "") + (ball && ball.stage === "back" ? " slowmo" : ""), style: ballStyle }, "🎾"),
      reveal ? e("div", { className: "courtflash " + (reveal.ace ? "ace" : "fail") }, flashText) : null,
      phase === "pick" ? e("div", { className: "cd" + (countdown <= 2 ? " urgent" : "") },
        "Automaatvalik: ", e("b", null, countdown)) : null));

  /* ---------- juhtpaneelid ---------- */

  let controls = null;
  if (phase === "bet") {
    const broke = saldo < MIN_BET;
    controls = e("div", { className: "betpanel" },
      e("div", { className: "betlbl" }, "1 · Vali vastane"),
      e("div", { className: "diffgrid" },
        DIFFS.map(d => e("button", {
          key: d.id, className: "diffcard" + (diffId === d.id ? " on" : ""),
          onClick: () => { AudioEngine.playSfx("click"); setDiffId(d.id); }
        },
          e("div", { className: "dname" }, d.emoji + " " + d.nimi),
          e("div", { className: "dmult" }, Math.round(d.p * 100) + "% äss · alates " + fmtX(ladderMult(d, 1))),
          e("div", { className: "dmeta" }, d.desc)))),
      e("div", { className: "betlbl" }, "2 · Vali panus"),
      e("div", { className: "chips" },
        BETS.map(b => e("button", {
          key: b, className: "chip" + (Math.abs(bet - b) < 1e-9 ? " on" : ""),
          disabled: b > saldo + 1e-9,
          onClick: () => { AudioEngine.playSfx("click"); setBet(b); }
        }, fmt(b)))),
      broke
        ? e("button", {
            className: "bigbtn", onClick: () => {
              AudioEngine.playSfx("click");
              setSaldo(START_SALDO);
              showToast("Uus saldo: " + fmt(START_SALDO));
            }
          }, "SALDO OTSAS — ALUSTA UUESTI (" + START_SALDO + ")")
        : e("button", {
            className: "bigbtn", disabled: bet > saldo + 1e-9 || bet < MIN_BET,
            onClick: startRun
          }, "ALUSTA TURNIIRI 🎾 — " + fmt(bet)));
  } else if (inRun) {
    const canPick = phase === "pick";
    controls = e(React.Fragment, null,
      e("div", { className: "serverow" },
        e("button", { className: "servebtn", disabled: !canPick, onClick: () => pick("L") },
          "⬅ SERVI", e("br", null), "VASAKULE"),
        e("button", { className: "servebtn rand", disabled: !canPick, onClick: () => pick(secureSide()), title: "Juhuslik pool" }, "🎲"),
        e("button", { className: "servebtn", disabled: !canPick, onClick: () => pick("R") },
          "SERVI ➡", e("br", null), "PAREMALE")),
      e("button", {
        className: "collectbtn", disabled: !canPick || rounds < 1, onClick: cashOut
      }, rounds < 1 ? "KORJA VÄLJA — alates 1. ässast" : "💰 KORJA VÄLJA " + fmt(curWin)),
      e("p", { className: "capnote", style: { marginTop: 8 } },
        "Järgmine aste: ", e("b", { style: { color: "var(--ball)" } }, fmt(nextWin)),
        " · vale pool = kõik läheb kaduma!"));
  }

  const statRowEl = e("div", { className: "statrow" },
    e("div", { className: "stat" },
      e("div", { className: "lbl" }, "Saldo"),
      e("div", { className: "val" }, fmt(saldo))),
    e("div", { className: "stat" },
      e("div", { className: "lbl" }, "Panus"),
      e("div", { className: "val", style: { color: "var(--ball)" } }, fmt(bet))),
    e("div", { className: "stat" },
      e("div", { className: "lbl" }, "Ralli"),
      e("div", { className: "val" }, rounds)),
    e("div", { className: "stat" },
      e("div", { className: "lbl" }, "Võit"),
      e("div", { className: "val winval" }, fmt(inRun ? curWin : lastWin))));

  /* ---------- overlay'd ---------- */

  const nameSaveBlock = (runRounds, cashedOut, amount) => (runRounds >= 1 && sb) ? e(React.Fragment, null,
    e("input", {
      className: "name-input", maxLength: 20, placeholder: "Sinu nimi",
      value: nameVal, onChange: ev => setNameVal(ev.target.value)
    }),
    e("button", {
      className: "courtbtn gold", disabled: saveState === "saving" || saveState === "saved",
      onClick: () => saveRun(runRounds, cashedOut, amount)
    }, saveState === "saved" ? "Salvestatud ✓" : saveState === "saving" ? "Salvestan…" : "Salvesta edetabelisse 🏆")) : null;

  let ovl = null;
  if (overlay) {
    if (overlay.kind === "lost") {
      ovl = e("div", { className: "ovl" },
        e("div", { className: "bigico" }, "😵"),
        e("h2", { style: { color: "var(--hot)" } }, "Turniir läbi!"),
        e("p", { className: "ovlnote" },
          "Oih! Kaitsja luges servi ära ja lõi tagasi. Rohkem õnne järgmisel korral!",
          e("br", null),
          "Ralli pikkus: ", e("b", null, overlay.rounds), " · kaotatud panus: ", e("b", null, fmt(overlay.bet))),
        nameSaveBlock(overlay.rounds, false, 0),
        e("div", { className: "btnrow" },
          e("a", { className: "courtbtn ghost", href: "/", style: { textDecoration: "none" } }, "Kodu"),
          e("button", { className: "courtbtn", onClick: backToBet }, "Uus panus 🎾")));
    } else if (overlay.kind === "cashed") {
      ovl = e("div", { className: "ovl" },
        e("div", { className: "bigico" }, "🏆"),
        e("div", { className: "winTitle" }, "KOGUVÕIT!"),
        e("div", { className: "winAmt" }, fmt(overlay.amt)),
        e("p", { className: "ovlnote" },
          "Ralli: ", e("b", null, overlay.rounds), " ässa",
          " · edetabelisse läheb ", e("b", { style: { color: "var(--ok)" } }, overlay.rounds + " (+" + CASHOUT_BONUS + ")"),
          " väljakorjamise boonusega!"),
        nameSaveBlock(overlay.rounds, true, overlay.amt),
        e("div", { className: "btnrow" },
          e("a", { className: "courtbtn ghost", href: "/", style: { textDecoration: "none" } }, "Kodu"),
          e("button", { className: "courtbtn", onClick: backToBet }, "Uus panus 🎾")));
    }
  }

  const boardOvl = boardOpen ? e("div", { className: "ovl", onClick: ev => { if (ev.target === ev.currentTarget) setBoardOpen(false); } },
    e("div", { className: "panel" },
      e("h2", { style: { marginBottom: 12 } }, "🏆 Edetabel"),
      e("div", { className: "tabs" },
        e("button", { className: "tab" + (boardTab === "rally" ? " on" : ""), onClick: () => { AudioEngine.playSfx("click"); setBoardTab("rally"); } }, "🎾 Pikim ralli"),
        e("button", { className: "tab" + (boardTab === "win" ? " on" : ""), onClick: () => { AudioEngine.playSfx("click"); setBoardTab("win"); } }, "💰 Suurim võit")),
      boardErr ? e("div", null,
        e("div", { className: "db-error" }, "Laadimine ebaõnnestus: " + boardErr),
        e("div", { style: { textAlign: "center", marginTop: 10 } },
          e("button", { className: "courtbtn ghost", onClick: () => loadBoard(boardTab) }, "Proovi uuesti 🔄"))) :
        boardRows == null ? e("div", { className: "board-empty" }, "Laen…") :
          boardRows.length === 0 ? e("div", { className: "board-empty" }, "Ole esimene edetabelis! Servi ässasid ja salvesta oma ralli.") :
            boardRows.map((r, i) => e("div", { className: "board-row", key: i },
              e("span", { className: "board-rank" }, i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1) + "."),
              e("span", { className: "board-name" }, (DIFF_BY_ID[r.difficulty] ? DIFF_BY_ID[r.difficulty].emoji + " " : "") + r.name),
              e("span", { className: "board-rally" }, r.rounds, r.cashed_out ? e("small", null, " (+" + (r.rally_score - r.rounds) + ")") : null),
              e("span", { className: "board-amt" }, fmt(+r.win_amount)))),
      e("p", { style: { fontSize: 11, color: "var(--inkSoft)", marginTop: 10, lineHeight: 1.5 } },
        "Väljakorjamine annab rallile +" + CASHOUT_BONUS + " boonusringi — tagasilöögiga kaotus mitte!"),
      e("div", { style: { textAlign: "center", marginTop: 12 } },
        e("button", { className: "courtbtn ghost", onClick: () => setBoardOpen(false) }, "Sulge")))) : null;

  const confEls = confetti.map(p => e("div", {
    key: p.id, className: "conf",
    style: {
      left: p.x + "%", width: p.w, height: p.h, background: p.color,
      animationDuration: p.dur + "s", animationDelay: p.delay + "s", "--rr": p.rot
    }
  }));

  return e(React.Fragment, null,
    e("div", { className: "wrap" },
      e("div", { className: "topbar" },
        e("a", { className: "back", href: "/" }, "← AVALEHT"),
        e("div", { className: "iconbtns" },
          e("button", { className: "icobtn", onClick: () => { AudioEngine.playSfx("click"); setBoardOpen(true); }, title: "Edetabel" }, "🏆"),
          e("button", {
            className: "icobtn" + (soundOn ? "" : " off"),
            onClick: () => { const v = !soundOn; setSoundOn(v); AudioEngine.setOn(v); if (v) AudioEngine.playSfx("click"); }, title: "Heli"
          }, "🔊"))),
      phase === "bet" ? e("div", { className: "hdr" },
        e("h1", null, "Tennis Run"),
        e("p", null, "tennise crash-mäng")) : null,

      e("div", { className: "ladderbar" }, e("div", { style: { width: ladderPct + "%" } })),
      e("div", { className: "ladder", ref: ladderRef }, rungs),
      history.length ? e("div", { className: "hist" }, histEls) : null,

      phase === "bet" ? null : court,

      // Mängu ajal on servinupud kohe väljaku all, statistika nende järel
      phase === "bet" ? statRowEl : controls,
      phase === "bet" ? controls : statRowEl,

      e("p", { className: "capnote" },
        "Kaitsja valib salaja poole enne igat servi (krüpto-juhuslikult). Äss = kordaja kasvab: ",
        activeDiff.emoji + " " + activeDiff.nimi + " ", fmtX(ladderMult(activeDiff, 1)), " → ", fmtX(ladderMult(activeDiff, 2)), " → ", fmtX(ladderMult(activeDiff, 3)), " → … ",
        "Kaotus = panus ja võidud kaovad. Korja välja millal iganes alates 1. ässast — edetabelis annab see +" + CASHOUT_BONUS + " boonusringi. ",
        "Mänguraha, päris raha siin ei liigu.")),

    confEls,
    toast ? e("div", { className: "toast" }, toast) : null,
    ovl, boardOvl);
}

ReactDOM.createRoot(document.getElementById("app")).render(e(App));
</script>
</body>
</html>
